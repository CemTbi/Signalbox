    parameters:
      - $ref: '#/components/parameters/VersionId'
    get:
      operationId: getVersion
      summary: Get a published version
      description: Returns one version. Its document is its revision's content.
      tags: [Specs]
      responses:
        '200':
          description: The version.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Version'}
              example:
                id: ver_01j9z3v2x4z6b8d0f2h4k6m8p0
                specId: spec_01j9z3r4t6v8x0z2b4d6f8h0k2
                name: 1.4.0
                revisionId: rev_01j9z3s7v9x1z3b5d7f9h1k3m5
                revisionNumber: 7
                apiVersion: 1.4.0
                notes: Adds refunds.
                publishedBy: usr_01j9z3kq4m8r2t6v0x5w7y9a1b
                publishedAt: '2026-10-17T12:00:00Z'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Error'}

  /api/v1/versions/{versionId}/reference:
    parameters:
      - $ref: '#/components/parameters/VersionId'
    get:
      operationId: getReference
      summary: Get a version's reference docs
      description: |
        Returns the reference that a published version's docs show: operations grouped by tag, with their parameters, bodies and responses, schemas with references resolved, and an example for every body. Descriptions are CommonMark, as the document wrote them.

        A version never changes, so its reference doesn't either. The ETag is the version's revision, and `If-None-Match` with it gets `304`.
      tags: [Specs]
      parameters:
        - name: If-None-Match
          in: header
          description: The ETag of a reference already loaded.
          schema: {type: string, maxLength: 200, examples: ['"rev_01j9z3s7v9x1z3b5d7f9h1k3m5"']}
      responses:
        '200':
          description: The reference.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Reference'}
              example:
                title: Orders API
                version: 1.4.0
                servers: [{url: 'https://orders.example.com/v1'}]
                groups:
                  - name: orders
                    operations:
                      - id: getOrder
                        operationId: getOrder
                        method: GET
                        path: '/orders/{id}'
                        summary: Get an order
                        parameters: [{name: id, in: path, required: true, schema: {types: [integer]}}]
                        responses:
                          - code: '200'
                            description: The order.
                            content: [{type: application/json, schema: {name: Order, types: [object]}, examples: [{value: '{"id": 42}'}]}]
        '304':
          description: The reference hasn't changed since the ETag in `If-None-Match`.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
            ETag: {$ref: '#/components/headers/ETag'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '501':
          description: The version is a Swagger 2.0 document, which reference docs don't support yet (`reference-unsupported`).
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              example: {type: about:blank, title: Not Implemented, status: 501, code: reference-unsupported, detail: This version is a Swagger 2.0 document. Reference docs need OpenAPI 3.0 or later.}
        default: {$ref: '#/components/responses/Error'}

  /api/v1/versions/{versionId}/code:
    parameters:
      - $ref: '#/components/parameters/VersionId'
    get:
      operationId: getCode
      summary: Download code generated from a version
      description: |
        Generates a client or a server stub from a published version and returns it as a zip. The archive holds a directory named after the package, with the generated code, a README, and `WARNINGS.md` when the generated code can't express part of the document.

        A version never changes, so the same version, target and package always give the same archive. The ETag names all three, and `If-None-Match` with it gets `304`.
      tags: [Specs]
      parameters:
        - name: target
          in: query
          required: true
          description: What to generate.
          schema:
            type: string
            enum: [go-client, go-server, typescript-client]
            examples: [typescript-client]
        - name: package
          in: query
          description: The package's name. It defaults to one made from the document's title, such as `orders` for "Orders API".
          schema: {type: string, pattern: '^[a-z][a-z0-9]*$', maxLength: 64, examples: [orders]}
        - name: If-None-Match
          in: header
          description: The ETag of an archive already downloaded.
          schema: {type: string, maxLength: 200, examples: ['"rev_01j9z3s7v9x1z3b5d7f9h1k3m5-typescript-client-"']}
      responses:
        '200':
          description: The generated code.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
            ETag: {$ref: '#/components/headers/ETag'}
            Content-Disposition:
              description: The archive's file name, such as `orders-typescript-client-1.4.0.zip`.
              schema: {type: string, examples: ['attachment; filename="orders-typescript-client-1.4.0.zip"']}
            X-Codegen-Warnings:
              description: How many parts of the document the generated code can't express. `WARNINGS.md` in the archive lists them.
              schema: {type: integer, minimum: 0, examples: [0]}
          content:
            application/zip:
              schema: {type: string, contentMediaType: application/zip, description: A zip archive.}
        '304':
          description: The archive hasn't changed since the ETag in `If-None-Match`.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
            ETag: {$ref: '#/components/headers/ETag'}
        '400':
          description: The target or package name is invalid (`invalid-target`, `invalid-package`).
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              example: {type: about:blank, title: Bad Request, status: 400, code: invalid-target, detail: 'Choose what to generate: go-client, go-server, typescript-client.'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422':
          description: The generator couldn't read the version's document (`codegen-failed`).
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              example: {type: about:blank, title: Unprocessable Entity, status: 422, code: codegen-failed, detail: "The code couldn't be generated from this version: a schema refers to a file that isn't available."}
        default: {$ref: '#/components/responses/Error'}

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-sbx_session
      description: |
        The browser session cookie set by `createSession`. Unsafe methods also need the `X-CSRF-Token` header from the session and an `Origin` header that matches the installation's public URL.

        Installations served over plain HTTP name the cookie `sbx_session` instead, because browsers drop cookies with the `__Host-` prefix there.
    bearerToken:
      type: http
      scheme: bearer
      description: A personal access token (`sbx_pat_…`) or service-account token (`sbx_sat_…`).

  parameters:
    CollectionId:
      name: collectionId
      in: path
      required: true
      description: The collection's ID.
      schema: {$ref: '#/components/schemas/CollectionId'}
    RunId:
      name: runId
      in: path
      required: true
      description: The run's ID.
      schema: {$ref: '#/components/schemas/RunId'}
    ItemId:
      name: itemId
      in: path
      required: true
      description: The item's ID.
      schema: {$ref: '#/components/schemas/ItemId'}
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      description: The workspace's ID.
      schema: {$ref: '#/components/schemas/WorkspaceId'}
    ProjectId:
      name: projectId
      in: path
      required: true
      description: The project's ID.
      schema: {$ref: '#/components/schemas/ProjectId'}
    EnvironmentId:
      name: environmentId
      in: path
      required: true
      description: The environment's ID.
      schema: {$ref: '#/components/schemas/EnvironmentId'}
    ServiceId:
      name: serviceId
      in: path
      required: true
      description: The service's ID.
      schema: {$ref: '#/components/schemas/ServiceId'}
    SpecId:
      name: specId
      in: path
      required: true
      description: The spec's ID.
      schema: {$ref: '#/components/schemas/SpecId'}
    RevisionId:
      name: revisionId
      in: path
      required: true
      description: The revision's ID.
      schema: {$ref: '#/components/schemas/RevisionId'}
    VersionId:
      name: versionId
      in: path
      required: true
      description: The version's ID.
      schema: {$ref: '#/components/schemas/VersionId'}
    UserId:
      name: userId
      in: path
      required: true
      description: The user's ID.
      schema: {$ref: '#/components/schemas/UserId'}
    InvitationId:
      name: invitationId
      in: path
      required: true
      description: The invitation's ID.
      schema: {$ref: '#/components/schemas/InvitationId'}
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of items to return.
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
      example: 50
    Cursor:
      name: cursor
      in: query
      required: false
      description: The `nextCursor` value from the previous page.
      schema: {type: string, maxLength: 512}
      example: eyJpZCI6IndzXzAxajl6M2txNG04cjJ0NnYweDV3N3k5YTFiIn0
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: The `ETag` of the version you edited. The request fails with 412 if the resource changed since.
      schema: {type: string, maxLength: 128}
      example: '"3"'
    IfMatchRequired:
      name: If-Match
      in: header
      required: true
      description: Required. The spec's current `ETag`, which names the revision your change is based on. The request fails with 412 if someone saved a newer revision.
      schema: {type: string, maxLength: 128}
      example: '"rev_01j9z3s7v9x1z3b5d7f9h1k3m5"'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        A unique key for this request. Repeating a request with the same key within 24 hours returns the first result instead of creating a duplicate.

        Planned: the server accepts the header but doesn't deduplicate requests yet.
      x-signalbox-status: planned
      schema: {type: string, minLength: 8, maxLength: 128}
      example: 3f1c2b8e-6d4a-4c1e-9b7a-2e5f8d0c1a94

  headers:
    RequestId:
      description: Identifies the request in server logs. Quote it when you report a problem.
      schema: {type: string, maxLength: 64}
      example: 9f8e7d6c5b4a39281706f5e4
    ETag:
      description: The version of the resource, for `If-Match`.
      schema: {type: string, maxLength: 128}
      example: '"3"'
    Location:
      description: URL of the created resource.
      schema: {type: string, format: uri-reference}
      example: /api/v1/workspaces/ws_01j9z3kq4m8r2t6v0x5w7y9a1b
    RetryAfter:
      description: Seconds to wait before retrying.
      schema: {type: integer, minimum: 0}
      example: 30

  responses:
    BadRequest:
      description: The request is malformed, or a field is invalid.
      headers:
        X-Request-Id: {$ref: '#/components/headers/RequestId'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: about:blank
            title: Bad Request
            status: 400
            detail: The request has 1 invalid field.
            code: validation-failed
            requestId: 9f8e7d6c5b4a39281706f5e4
            errors:
              - pointer: /slug
                detail: Use lowercase letters, digits and single hyphens.
                code: pattern
    Unauthorized:
      description: The request has no valid session or token.
      headers:
        X-Request-Id: {$ref: '#/components/headers/RequestId'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: about:blank
            title: Unauthorized
            status: 401
            detail: Sign in, or send a valid token in the Authorization header.
            code: unauthenticated
            requestId: 9f8e7d6c5b4a39281706f5e4
    Forbidden:
      description: The caller is signed in but isn't allowed to do this.
      headers:
        X-Request-Id: {$ref: '#/components/headers/RequestId'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: about:blank
            title: Forbidden
            status: 403
            detail: Only workspace owners can delete a workspace.
            code: permission-denied
            requestId: 9f8e7d6c5b4a39281706f5e4
    NotFound:
      description: The resource doesn't exist, or the caller can't see it.
      headers:
        X-Request-Id: {$ref: '#/components/headers/RequestId'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: about:blank
            title: Not Found
            status: 404
            detail: There is no project with this ID.
            code: not-found
            requestId: 9f8e7d6c5b4a39281706f5e4
    Conflict:
      description: The request conflicts with an existing resource, such as a slug that is already taken.
      headers:
        X-Request-Id: {$ref: '#/components/headers/RequestId'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: about:blank
            title: Conflict
            status: 409
            detail: The slug payments is already taken in this installation.
            code: slug-taken
            requestId: 9f8e7d6c5b4a39281706f5e4
    PreconditionFailed:
      description: The resource changed since the `ETag` in `If-Match`. Load it again and reapply your change.
      headers:
        X-Request-Id: {$ref: '#/components/headers/RequestId'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: about:blank
            title: Precondition Failed
            status: 412
            detail: Someone saved a newer revision. Merge your changes into it and save again.
            code: edit-conflict
            requestId: 9f8e7d6c5b4a39281706f5e4
    PreconditionRequired:
      description: This request needs an `If-Match` header.
      headers:
        X-Request-Id: {$ref: '#/components/headers/RequestId'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: about:blank
            title: Precondition Required
            status: 428
            detail: Send the spec's current ETag in If-Match.
            code: if-match-required
            requestId: 9f8e7d6c5b4a39281706f5e4
    ContentTooLarge:
      description: The request body is larger than the installation allows.
      headers:
        X-Request-Id: {$ref: '#/components/headers/RequestId'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: about:blank
            title: Request Entity Too Large
            status: 413
            detail: The document is larger than 10 MiB.
            code: document-too-large
            requestId: 9f8e7d6c5b4a39281706f5e4
    LastOwner:
      description: The change would leave the workspace without an owner.
      headers:
        X-Request-Id: {$ref: '#/components/headers/RequestId'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: about:blank
            title: Conflict
            status: 409
            detail: A workspace needs at least one owner. Make someone else an owner first.
            code: last-owner
            requestId: 9f8e7d6c5b4a39281706f5e4
    InvitationNotFound:
      description: The invitation link is wrong, expired or already used.
      headers:
        X-Request-Id: {$ref: '#/components/headers/RequestId'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: about:blank
            title: Not Found
            status: 404
            detail: This invitation link is wrong, expired or already used. Ask for a new one.
            code: invitation-not-found
            requestId: 9f8e7d6c5b4a39281706f5e4
    NotImportable:
      description: The file isn't a Postman collection or environment Signalbox reads (`not-postman`), or the text isn't a curl command it reads (`not-curl`). The detail says why.
      headers:
        X-Request-Id: {$ref: '#/components/headers/RequestId'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example: {type: about:blank, title: Unprocessable Content, status: 422, code: not-postman, detail: "Signalbox can't import this file: it's a Postman v1 collection; export it from Postman again as Collection v2.1."}
    SecretsUnavailable:
      description: The server can't keep or read secrets. It has no secret key (`secrets-unavailable`), or the secrets were stored with another key (`secret-key-changed`).
      headers:
        X-Request-Id: {$ref: '#/components/headers/RequestId'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example: {type: about:blank, title: Service Unavailable, status: 503, code: secrets-unavailable, detail: "This server has no secret key, so it can't keep secrets. An administrator can set SIGNALBOX_SECRET_KEY to 32 random bytes in base64, such as the output of openssl rand -base64 32."}
    TooManyRequests:
      description: The caller sent too many requests. Wait for the time in `Retry-After`.
      headers:
        Retry-After: {$ref: '#/components/headers/RetryAfter'}
        X-Request-Id: {$ref: '#/components/headers/RequestId'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: about:blank
            title: Too Many Requests
            status: 429
            detail: Try again in 30 seconds.
            code: rate-limited
            requestId: 9f8e7d6c5b4a39281706f5e4
    Error:
      description: Any other error, such as an unexpected failure on the server.
      headers:
        X-Request-Id: {$ref: '#/components/headers/RequestId'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: about:blank
            title: Internal Server Error
            status: 500
            detail: Something went wrong on the server. Quote the request ID when you report it.
            code: internal-error
            requestId: 9f8e7d6c5b4a39281706f5e4

  schemas:
    WorkspaceId:
      type: string
      description: A workspace ID.
      pattern: '^ws_[0-9a-hjkmnp-tv-z]{26}$'
      examples: [ws_01j9z3kq4m8r2t6v0x5w7y9a1b]
    ProjectId:
      type: string
      description: A project ID.
      pattern: '^prj_[0-9a-hjkmnp-tv-z]{26}$'
      examples: [prj_01j9z3m2p4r6t8v0x2z4b6d8f0]
    EnvironmentId:
      type: string
      description: An environment ID.
      pattern: '^env_[0-9a-hjkmnp-tv-z]{26}$'
      examples: [env_01j9z3n5q7s9v1w3y5a7c9e1g3]
    ServiceId:
      type: string
      description: A service ID.
      pattern: '^svc_[0-9a-hjkmnp-tv-z]{26}$'
      examples: [svc_01j9z3q1s3v5w7y9a1c3e5g7j9]
    SpecId:
      type: string
      description: A spec ID.
      pattern: '^spec_[0-9a-hjkmnp-tv-z]{26}$'
      examples: [spec_01j9z3r4t6v8x0z2b4d6f8h0k2]
    RevisionId:
      type: string
      description: A revision ID.
      pattern: '^rev_[0-9a-hjkmnp-tv-z]{26}$'
      examples: [rev_01j9z3s7v9x1z3b5d7f9h1k3m5]
    VersionId:
      type: string
      description: A published version's ID.
      pattern: '^ver_[0-9a-hjkmnp-tv-z]{26}$'
      examples: [ver_01j9z3v2x4z6b8d0f2h4k6m8p0]
    UserId:
      type: string
      description: A user ID.
      pattern: '^usr_[0-9a-hjkmnp-tv-z]{26}$'
      examples: [usr_01j9z3kq4m8r2t6v0x5w7y9a1b]
    InvitationId:
      type: string
      description: An invitation ID.
      pattern: '^inv_[0-9a-hjkmnp-tv-z]{26}$'
      examples: [inv_01j9z3v2x4z6b8d0f2h4k6m8p0]
    AccessTokenId:
      type: string
      description: An access token's ID.
      pattern: '^tok_[0-9a-hjkmnp-tv-z]{26}$'
      examples: [tok_01j9z3w5y7a9c1e3g5j7m9p1r3]
    AccessToken:
      type: object
      description: A personal access token, without its secret.
      required: [id, name, hint, createdAt, expiresAt, expired]
      properties:
        id: {$ref: '#/components/schemas/AccessTokenId'}
        name: {type: string, maxLength: 100, description: Where the token is used., examples: [GitHub Actions]}
        hint: {type: string, minLength: 4, maxLength: 4, description: The token's last four characters, to tell tokens apart., examples: [x9Qa]}
        createdAt: {$ref: '#/components/schemas/Timestamp'}
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
          type: string
          description: When the token stops working.
          examples: ['2027-01-16T12:00:00Z']
        lastUsedAt:
          $ref: '#/components/schemas/Timestamp'
          type: string
          description: When the token was last used, to the minute. Absent if it never was.
          examples: ['2026-10-18T12:30:00Z']
        expired: {type: boolean, description: Whether the token has expired. Expired tokens stay listed for 30 days., examples: [false]}
    NewAccessToken:
      description: A token that was just created, with its secret, shown this once.
      allOf:
        - $ref: '#/components/schemas/AccessToken'
        - type: object
          description: The secret.
          required: [token]
          properties:
            token:
              type: string
              pattern: '^sbx_pat_[A-Za-z0-9_-]{43}$'
              description: The token. Store it now; it can't be shown again.
              examples: [sbx_pat_3q2-7wEjK9bM4xR1vT6nY8pL0sD5gH2fA7cZ9eUx9Qa]
    AccessTokenCreate:
      type: object
      description: A new access token.
      required: [name]
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 100, description: 'Where the token will be used, such as GitHub Actions.', examples: [GitHub Actions]}
        expiresInDays: {type: integer, minimum: 1, maximum: 366, default: 90, description: How many days the token works., examples: [90]}
    AccessTokenList:
      type: object
      description: Your access tokens.
      required: [data]
      properties:
        data:
          type: array
          description: The tokens, newest first.
          maxItems: 50
          items: {$ref: '#/components/schemas/AccessToken'}
          examples: [[{id: tok_01j9z3w5y7a9c1e3g5j7m9p1r3, name: GitHub Actions, hint: x9Qa, createdAt: '2026-10-18T12:00:00Z', expiresAt: '2027-01-16T12:00:00Z', expired: false}]]
    HistoryEntryId:
      type: string
      description: A history entry's ID.
      pattern: '^hist_[0-9a-hjkmnp-tv-z]{26}$'
      examples: [hist_01j9z3w5y7a9c1e3g5j7m9p1r3]
    HttpHeader:
      type: object
      description: One HTTP header.
      required: [key, value]
      properties:
        key: {type: string, maxLength: 1000, description: The header's name., examples: [Accept]}
        value: {type: string, maxLength: 65536, description: The header's value., examples: [application/json]}
    SendRequest:
      type: object
      description: A request to send.
      required: [method, url]
      additionalProperties: false
      properties:
        environmentId: {$ref: '#/components/schemas/EnvironmentId'}
        collectionId: {$ref: '#/components/schemas/CollectionId'}
        itemId: {$ref: '#/components/schemas/ItemId'}
        scripts: {$ref: '#/components/schemas/Scripts'}
        auth: {$ref: '#/components/schemas/RequestAuth'}
        method: {type: string, maxLength: 32, description: 'The HTTP method, such as GET.', examples: [GET]}
        url: {type: string, maxLength: 8192, description: 'The absolute http or https URL, once its variables are filled in.', examples: ['{{baseUrl}}/orders/42']}
        headers:
          type: array
          description: Headers, in order. Empty names are skipped. The runner adds `User-Agent` if there's none.
          maxItems: 200
          items: {$ref: '#/components/schemas/HttpHeader'}
          examples: [[{key: Accept, value: application/json}]]
        body: {type: string, maxLength: 10485760, description: The body, as text., examples: ['{"sku":"A-1"}']}
        timeoutMs: {type: integer, minimum: 0, maximum: 300000, description: 'How long to wait, up to the runner''s limit (30 s by default). 0 means the limit.', examples: [10000]}
    SentRequest:
      type: object
      description: A request as history keeps it.
      required: [headers]
      properties:
        auth: {$ref: '#/components/schemas/RequestAuth'}
        headers:
          type: array
          description: The headers sent, with credential values as •••.
          items: {$ref: '#/components/schemas/HttpHeader'}
          examples: [[{key: Authorization, value: •••}]]
        body: {type: string, description: 'The body sent, its first 64 KiB.', examples: ['{"sku":"A-1"}']}
        bodyTruncated: {type: boolean, description: Whether the body was longer than history keeps., examples: [false]}
    RunnerResponse:
      type: object
      description: A response the runner received.
      required: [status, proto, headers, body, bodyEncoding, size, truncated, url, redirects]
      properties:
        status: {type: integer, minimum: 100, maximum: 999, description: The status code., examples: [200]}
        statusText: {type: string, description: The status code's reason phrase., examples: [OK]}
        proto: {type: string, description: 'The protocol, such as HTTP/2.0.', examples: [HTTP/2.0]}
        headers:
          type: array
          description: 'The response headers, by name, each name''s values in order.'
          items: {$ref: '#/components/schemas/HttpHeader'}
          examples: [[{key: Content-Type, value: application/json}]]
        body: {type: string, description: 'The body: text, or base64 when it isn''t UTF-8.', examples: ['{"id":42}']}
        bodyEncoding: {type: string, enum: [text, base64], description: How `body` is encoded., examples: [text]}
        size: {type: integer, minimum: 0, description: The body's size in bytes, as kept., examples: [9]}
        truncated: {type: boolean, description: 'Whether the body was cut: at 10 MiB when sent, at 1 MiB in history.', examples: [false]}
        url: {type: string, description: Where the response came from, after redirects., examples: ['https://api.example.com/orders/42']}
        redirects: {type: integer, minimum: 0, description: How many redirects were followed., examples: [0]}
        remoteAddress: {type: string, description: 'The address and port the runner connected to.', examples: ['203.0.113.7:443']}
    RunnerFailure:
      type: object
      description: Why a request got no response.
      required: [code, message]
      properties:
        code: {type: string, enum: [invalid-request, blocked, dns, connect, tls, timeout, network, script, skipped, too-large], description: 'The kind of failure. `script`: a pre-request script failed, so the request wasn''t sent. `skipped`: a pre-request script skipped it. `too-large`: in a run, the request was too large once its variables were filled in.', examples: [timeout]}
        message: {type: string, description: What went wrong, in words a person can act on., examples: ["The server didn't answer in time."]}
    RunnerTimings:
      type: object
      description: 'How long each phase took, in milliseconds. Phases that didn''t happen, such as TLS on a reused connection, are 0.'
      required: [dnsMs, connectMs, tlsMs, firstByteMs, downloadMs, totalMs]
      properties:
        dnsMs: {type: number, minimum: 0, description: Looking up the host., examples: [4.1]}
        connectMs: {type: number, minimum: 0, description: Opening the TCP connection., examples: [12.3]}
        tlsMs: {type: number, minimum: 0, description: The TLS handshake., examples: [25.8]}
        firstByteMs: {type: number, minimum: 0, description: From sending the request to the response's first byte., examples: [40.2]}
        downloadMs: {type: number, minimum: 0, description: Reading the body., examples: [0.3]}
        totalMs: {type: number, minimum: 0, description: The whole request., examples: [83.5]}
    HistoryEntry:
      type: object
      description: A sent request and what came of it. It has `response` or `failure`.
      required: [id, method, url, sentAt, request, timings]
      properties:
        id: {$ref: '#/components/schemas/HistoryEntryId'}
        environmentId: {$ref: '#/components/schemas/EnvironmentId'}
        unresolved:
          type: array
          description: The `{{names}}` that had no value, and were sent as they are.
          items: {type: string}
          examples: [[orderId]]
        method: {type: string, description: The method sent., examples: [GET]}
        url: {type: string, description: 'The URL sent, variables filled in. In history, secret values are •••.', examples: ['https://api.example.com/orders/42']}
        sentAt: {$ref: '#/components/schemas/Timestamp'}
        request: {$ref: '#/components/schemas/SentRequest'}
        response: {$ref: '#/components/schemas/RunnerResponse'}
        failure: {$ref: '#/components/schemas/RunnerFailure'}
        scripts: {$ref: '#/components/schemas/ScriptOutcome'}
        timings: {$ref: '#/components/schemas/RunnerTimings'}
    HistorySummary:
      type: object
