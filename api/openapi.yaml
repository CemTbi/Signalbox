  /api/v1/environments/{environmentId}/variable-imports:
    parameters:
      - $ref: '#/components/parameters/EnvironmentId'
    post:
      operationId: importVariables
      summary: Import a Postman environment
      description: |
        Adds a Postman environment file's variables to the environment. A variable with the name of one the environment has replaces it in place; the others go at the end. Postman's secret variables stay secret, which needs the server's secret key. Owners, admins and editors may.
      tags: [Environments]
      parameters:
        - name: dryRun
          in: query
          required: false
          description: true checks the environment file and returns the report without importing it.
          schema: {type: boolean}
          example: true
      requestBody:
        required: true
        description: The Postman environment file.
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PostmanFile'}
            example: {name: Staging, _postman_variable_scope: environment, values: [{key: baseUrl, value: 'https://staging.example.com', enabled: true}]}
      responses:
        '200':
          description: The environment's variables after the import, and the report; a dry run has only the report.
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VariablesImport'}
              example:
                variables: {environmentId: env_01j9z3n5q7s9v1w3y5a7c9e1g3, variables: [{key: baseUrl, value: 'https://staging.example.com', secret: false}], updatedAt: '2026-10-19T12:00:00Z'}
                report: {clean: true, folders: 0, requests: 0, variables: 1, notes: []}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/ContentTooLarge'}
        '422': {$ref: '#/components/responses/NotImportable'}
        '503': {$ref: '#/components/responses/SecretsUnavailable'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/curl-imports:
    post:
      operationId: importCurl
      summary: Read a curl command
      description: Turns a curl command, such as one from a browser's Copy as cURL for bash or cmd, into a request to send or save, and reports the options it couldn't follow. Nothing is stored.
      tags: [Client]
      requestBody:
        required: true
        description: The command.
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CurlCommand'}
            example: {command: "curl 'https://api.example.com/orders' -H 'accept: application/json'"}
      responses:
        '200':
          description: The request, and the report.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CurlImport'}
              example:
                request: {method: GET, url: 'https://api.example.com/orders', headers: [{key: accept, value: application/json, enabled: true}]}
                report: {clean: true, folders: 0, requests: 1, variables: 0, notes: []}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/NotImportable'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/collections/{collectionId}/items:
    parameters:
      - $ref: '#/components/parameters/CollectionId'
    get:
      operationId: listItems
      summary: List a collection's folders and requests
      description: Lists every folder and request in the collection, each folder's items in order, top-level items first. Requests carry only their method and URL; get an item for the rest.
      tags: [Client]
      responses:
        '200':
          description: The items.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ItemList'}
              example:
                data:
                  - {id: item_01j9z3w5y7a9c1e3g5j7m9p1r3, collectionId: col_01j9z3w5y7a9c1e3g5j7m9p1r3, kind: folder, name: Orders, createdAt: '2026-10-18T12:00:00Z', updatedAt: '2026-10-18T12:00:00Z'}
                  - {id: item_01j9z3w6a8c0e2g4j6m8p0r2t4, collectionId: col_01j9z3w5y7a9c1e3g5j7m9p1r3, parentId: item_01j9z3w5y7a9c1e3g5j7m9p1r3, kind: request, name: Get an order, request: {method: GET, url: '{{baseUrl}}/orders/1'}, createdAt: '2026-10-18T12:00:00Z', updatedAt: '2026-10-18T12:00:00Z'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createItem
      summary: Add a folder or request
      description: Adds a folder or a saved request to the collection, in `parentId` (the top when absent), before `before` or at the end. Owners, admins and editors may. A collection holds at most 10,000 items, and folders nest at most 20 deep.
      tags: [Client]
      requestBody:
        required: true
        description: The new item.
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ItemCreate'}
            example: {kind: request, name: Get an order, request: {method: GET, url: '{{baseUrl}}/orders/1', headers: [{key: Accept, value: application/json, enabled: true}], body: ''}}
      responses:
        '201':
          description: The item that was added.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
            Location: {$ref: '#/components/headers/Location'}
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Item'}
              example: {id: item_01j9z3w6a8c0e2g4j6m8p0r2t4, collectionId: col_01j9z3w5y7a9c1e3g5j7m9p1r3, kind: request, name: Get an order, request: {method: GET, url: '{{baseUrl}}/orders/1', headers: [{key: Accept, value: application/json, enabled: true}]}, createdAt: '2026-10-18T12:00:00Z', updatedAt: '2026-10-18T12:00:00Z'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/collections/{collectionId}/runs:
    parameters:
      - $ref: '#/components/parameters/CollectionId'
    get:
      operationId: listRuns
      summary: List a collection's runs
      description: Lists the collection's test runs, newest first. Runs are kept 90 days, and at most the newest 100 of a collection. Every member of the project may.
      tags: [Test runs]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of runs.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunPage'}
              example: {data: [{id: run_01j9z3w5y7a9c1e3g5j7m9p1r3, projectId: prj_01j9z3k5m7p9r1t3v5x7z9b1c3, collectionId: col_01j9z3w5y7a9c1e3g5j7m9p1r3, name: Shop API, environment: Staging, status: failed, iterations: 2, dataRows: 2, delayMs: 0, bail: false, totals: {requests: 6, failedRequests: 1, tests: 12, failedTests: 1}, createdAt: '2026-10-28T12:00:00Z', startedAt: '2026-10-28T12:00:00Z', finishedAt: '2026-10-28T12:00:02Z', durationMs: 1834.2}]}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: startRun
      summary: Run a collection as a test suite
      description: |
        Starts a run of the collection, or of one folder of it: its requests in order, with the scripts of the collection and folders around each, any number of iterations, optionally once per row of a data file. Values scripts set carry from one request to the next, and aren't saved. The run waits for a free slot, then runs in the background; follow it with `getRun` and `listRunSteps`. A run sends at most 10,000 requests and lasts at most an hour. Owners, admins and editors may. See ADR-0033.
      tags: [Test runs]
      requestBody:
        description: How to run it. An empty object runs the whole collection once, without an environment.
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RunStart'}
            example: {environmentId: env_01j9z3n5q7s9v1w3y5a7c9e1g3, data: {format: csv, content: "user\nada\nbob\n"}, bail: true}
      responses:
        '202':
          description: The run, queued.
          headers:
            Location: {$ref: '#/components/headers/Location'}
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Run'}
              example: {id: run_01j9z3w5y7a9c1e3g5j7m9p1r3, projectId: prj_01j9z3k5m7p9r1t3v5x7z9b1c3, collectionId: col_01j9z3w5y7a9c1e3g5j7m9p1r3, name: Shop API, status: queued, iterations: 2, dataRows: 2, delayMs: 0, bail: true, totals: {requests: 0, failedRequests: 0, tests: 0, failedTests: 0}, createdAt: '2026-10-28T12:00:00Z', durationMs: 0}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/ContentTooLarge'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503':
          description: This server doesn't run the runner role (`runner-unavailable`), or can't read the environment's secrets (`secrets-unavailable`, `secret-key-changed`).
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              example: {type: about:blank, title: Service Unavailable, status: 503, code: runner-unavailable, detail: "This server doesn't run the runner role, which sends requests. Run signalbox-server with --roles=all."}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/runs/{runId}:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      operationId: getRun
      summary: Get a run
      description: Returns a run with its totals so far. Every member of the project may.
      tags: [Test runs]
      responses:
        '200':
          description: The run.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Run'}
              example: {id: run_01j9z3w5y7a9c1e3g5j7m9p1r3, projectId: prj_01j9z3k5m7p9r1t3v5x7z9b1c3, collectionId: col_01j9z3w5y7a9c1e3g5j7m9p1r3, name: Shop API, environment: Staging, status: failed, iterations: 2, dataRows: 2, delayMs: 0, bail: false, totals: {requests: 6, failedRequests: 1, tests: 12, failedTests: 1}, createdAt: '2026-10-28T12:00:00Z', startedAt: '2026-10-28T12:00:00Z', finishedAt: '2026-10-28T12:00:02Z', durationMs: 1834.2}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/runs/{runId}/cancel:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      operationId: cancelRun
      summary: Cancel a run
      description: Cancels a run. A queued run ends at once; a running one stops after the request it's on. Cancelling a finished run changes nothing. Owners, admins and editors may.
      tags: [Test runs]
      responses:
        '200':
          description: The run.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Run'}
              example: {id: run_01j9z3w5y7a9c1e3g5j7m9p1r3, projectId: prj_01j9z3k5m7p9r1t3v5x7z9b1c3, collectionId: col_01j9z3w5y7a9c1e3g5j7m9p1r3, name: Shop API, environment: Staging, status: failed, iterations: 2, dataRows: 2, delayMs: 0, bail: false, totals: {requests: 6, failedRequests: 1, tests: 12, failedTests: 1}, createdAt: '2026-10-28T12:00:00Z', startedAt: '2026-10-28T12:00:00Z', finishedAt: '2026-10-28T12:00:02Z', durationMs: 1834.2}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/runs/{runId}/steps:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      operationId: listRunSteps
      summary: List a run's steps
      description: Lists a run's steps in order, after `after`. To follow a run, ask again with the last `seq` you saw until the run has finished and `more` is false. Steps here leave out headers, console output, variable changes and response bodies; `getRunStep` has them.
      tags: [Test runs]
      parameters:
        - name: after
          in: query
          required: false
          description: The last `seq` you saw; 0 or absent starts at the first step.
          schema: {type: integer, minimum: 0}
          example: 20
        - name: limit
          in: query
          required: false
          description: Maximum number of steps to return.
          schema: {type: integer, minimum: 1, maximum: 500, default: 500}
          example: 100
      responses:
        '200':
          description: A page of steps.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunStepPage'}
              example: {data: [{seq: 2, iteration: 0, itemId: item_01j9z3w5y7a9c1e3g5j7m9p1r3, name: Create an order, path: Orders, method: POST, url: 'https://api.example.com/orders', failed: true, durationMs: 83.5, response: {status: 500, statusText: Internal Server Error, size: 24}, scripts: {tests: [{from: Create an order, name: is created, passed: false, error: 'AssertionError: expected 500 to equal 201'}], logs: [], errors: [], changes: [], skipped: false}}], more: false}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/runs/{runId}/steps/{seq}:
    parameters:
      - $ref: '#/components/parameters/RunId'
      - name: seq
        in: path
        required: true
        description: The step's place in the run, from 1.
        schema: {type: integer, minimum: 1}
        example: 3
    get:
      operationId: getRunStep
      summary: Get a step of a run
      description: Returns one step in full, with headers, console output, variable changes, and the start of the response body when the step failed.
      tags: [Test runs]
      responses:
        '200':
          description: The step.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunStep'}
              example: {seq: 2, iteration: 0, itemId: item_01j9z3w5y7a9c1e3g5j7m9p1r3, name: Create an order, path: Orders, method: POST, url: 'https://api.example.com/orders', failed: true, durationMs: 83.5, response: {status: 500, statusText: Internal Server Error, size: 24}, scripts: {tests: [{from: Create an order, name: is created, passed: false, error: 'AssertionError: expected 500 to equal 201'}], logs: [], errors: [], changes: [], skipped: false}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/runs/{runId}/report:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      operationId: getRunReport
      summary: Download a run's report
      description: Returns the run as a JUnit XML file for CI, a JSON file with every step, or a self-contained HTML page that runs no scripts. Secrets are shown as •••.
      tags: [Test runs]
      parameters:
        - name: format
          in: query
          required: false
          description: The report's format.
          schema: {type: string, enum: [junit, json, html], default: json}
          example: junit
      responses:
        '200':
          description: The report, as a file to save.
          headers:
            Content-Disposition:
              description: 'Names the file, such as `shop-api-run_01j9z3w5y7a9c1e3g5j7m9p1r3.xml`.'
              schema: {type: string}
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/xml:
              schema: {description: 'A JUnit XML document: a testsuite per request per iteration, a testcase per test.'}
              example: '<?xml version="1.0" encoding="UTF-8"?><testsuites name="Shop API" tests="1" failures="0" errors="0" skipped="0" time="0.084"></testsuites>'
            application/json:
              schema: {type: object}
              example: {id: run_01j9z3w5y7a9c1e3g5j7m9p1r3, name: Shop API, status: passed, iterations: 1, totals: {requests: 1, failedRequests: 0, tests: 1, failedTests: 0}, startedAt: '2026-10-28T12:00:00Z', durationMs: 84, steps: []}
            text/html:
              schema: {type: string}
              example: '<!doctype html><html lang="en">…</html>'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/items/{itemId}:
    parameters:
      - $ref: '#/components/parameters/ItemId'
    get:
      operationId: getItem
      summary: Get a folder or request
      description: Returns a folder, or a saved request with its headers and body.
      tags: [Client]
      responses:
        '200':
          description: The item.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Item'}
              example: {id: item_01j9z3w6a8c0e2g4j6m8p0r2t4, collectionId: col_01j9z3w5y7a9c1e3g5j7m9p1r3, kind: request, name: Get an order, request: {method: GET, url: '{{baseUrl}}/orders/1', headers: [{key: Accept, value: application/json, enabled: true}]}, createdAt: '2026-10-18T12:00:00Z', updatedAt: '2026-10-18T12:00:00Z'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      operationId: updateItem
      summary: Change or move a folder or request
      description: |
        Renames, describes or replaces the request of an item, or moves it. Sending `parentId` or `before` moves it: into `parentId` (null for the top of the collection), before `before` (null for the end). A folder can't move inside itself. Owners, admins and editors may.

        `If-Match` is optional: without it, the last change wins.
      tags: [Client]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        description: The item's fields to change, as a JSON Merge Patch (RFC 7396).
        content:
          application/merge-patch+json:
            schema: {$ref: '#/components/schemas/ItemUpdate'}
            example: {name: Get one order, parentId: null}
      responses:
        '200':
          description: The changed item.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Item'}
              example: {id: item_01j9z3w6a8c0e2g4j6m8p0r2t4, collectionId: col_01j9z3w5y7a9c1e3g5j7m9p1r3, kind: request, name: Get one order, request: {method: GET, url: '{{baseUrl}}/orders/1'}, createdAt: '2026-10-18T12:00:00Z', updatedAt: '2026-10-18T12:30:00Z'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteItem
      summary: Delete a folder or request
      description: Deletes an item, and a folder's contents with it. Owners, admins and editors may.
      tags: [Client]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: The item is deleted.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/projects/{projectId}/services:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
