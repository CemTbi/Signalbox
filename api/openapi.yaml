components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-sbx_session
      description: |
        The browser session cookie set by `createSession`. Unsafe methods also need the `X-CSRF-Token` header from the session and an `Origin` header that matches the installation's public URL.

        Installations served over plain HTTP name the cookie `sbx_session` instead, because browsers drop cookies with the `__Host-` prefix there.
    bearerToken:
      type: http
      scheme: bearer
      description: A personal access token (`sbx_pat_…`) or service-account token (`sbx_sat_…`).

  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      description: The workspace's ID.
      schema: {$ref: '#/components/schemas/WorkspaceId'}
    ProjectId:
      name: projectId
      in: path
      required: true
      description: The project's ID.
      schema: {$ref: '#/components/schemas/ProjectId'}
    EnvironmentId:
      name: environmentId
      in: path
      required: true
      description: The environment's ID.
      schema: {$ref: '#/components/schemas/EnvironmentId'}
    ServiceId:
      name: serviceId
      in: path
      required: true
      description: The service's ID.
      schema: {$ref: '#/components/schemas/ServiceId'}
    SpecId:
      name: specId
      in: path
      required: true
      description: The spec's ID.
      schema: {$ref: '#/components/schemas/SpecId'}
    RevisionId:
      name: revisionId
      in: path
      required: true
      description: The revision's ID.
      schema: {$ref: '#/components/schemas/RevisionId'}
    UserId:
      name: userId
      in: path
      required: true
      description: The user's ID.
      schema: {$ref: '#/components/schemas/UserId'}
    InvitationId:
      name: invitationId
      in: path
      required: true
      description: The invitation's ID.
      schema: {$ref: '#/components/schemas/InvitationId'}
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of items to return.
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
      example: 50
    Cursor:
      name: cursor
      in: query
      required: false
      description: The `nextCursor` value from the previous page.
      schema: {type: string, maxLength: 512}
      example: eyJpZCI6IndzXzAxajl6M2txNG04cjJ0NnYweDV3N3k5YTFiIn0
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: The `ETag` of the version you edited. The request fails with 412 if the resource changed since.
      schema: {type: string, maxLength: 128}
      example: '"3"'
    IfMatchRequired:
      name: If-Match
      in: header
      required: true
      description: Required. The spec's current `ETag`, which names the revision your change is based on. The request fails with 412 if someone saved a newer revision.
      schema: {type: string, maxLength: 128}
      example: '"rev_01j9z3s7v9x1z3b5d7f9h1k3m5"'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        A unique key for this request. Repeating a request with the same key within 24 hours returns the first result instead of creating a duplicate.

        Planned: the server accepts the header but doesn't deduplicate requests yet.
      x-signalbox-status: planned
      schema: {type: string, minLength: 8, maxLength: 128}
      example: 3f1c2b8e-6d4a-4c1e-9b7a-2e5f8d0c1a94

  headers:
    RequestId:
      description: Identifies the request in server logs. Quote it when you report a problem.
      schema: {type: string, maxLength: 64}
      example: 9f8e7d6c5b4a39281706f5e4
    ETag:
      description: The version of the resource, for `If-Match`.
      schema: {type: string, maxLength: 128}
      example: '"3"'
    Location:
      description: URL of the created resource.
      schema: {type: string, format: uri-reference}
      example: /api/v1/workspaces/ws_01j9z3kq4m8r2t6v0x5w7y9a1b
    RetryAfter:
      description: Seconds to wait before retrying.
      schema: {type: integer, minimum: 0}
      example: 30

  responses:
    BadRequest:
      description: The request is malformed, or a field is invalid.
      headers:
        X-Request-Id: {$ref: '#/components/headers/RequestId'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: about:blank
            title: Bad Request
            status: 400
            detail: The request has 1 invalid field.
            code: validation-failed
            requestId: 9f8e7d6c5b4a39281706f5e4
            errors:
              - pointer: /slug
                detail: Use lowercase letters, digits and single hyphens.
                code: pattern
    Unauthorized:
      description: The request has no valid session or token.
      headers:
        X-Request-Id: {$ref: '#/components/headers/RequestId'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: about:blank
            title: Unauthorized
            status: 401
            detail: Sign in, or send a valid token in the Authorization header.
            code: unauthenticated
            requestId: 9f8e7d6c5b4a39281706f5e4
    Forbidden:
      description: The caller is signed in but isn't allowed to do this.
      headers:
        X-Request-Id: {$ref: '#/components/headers/RequestId'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: about:blank
            title: Forbidden
            status: 403
            detail: Only workspace owners can delete a workspace.
            code: permission-denied
            requestId: 9f8e7d6c5b4a39281706f5e4
    NotFound:
      description: The resource doesn't exist, or the caller can't see it.
      headers:
        X-Request-Id: {$ref: '#/components/headers/RequestId'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: about:blank
            title: Not Found
            status: 404
            detail: There is no project with this ID.
            code: not-found
            requestId: 9f8e7d6c5b4a39281706f5e4
    Conflict:
      description: The request conflicts with an existing resource, such as a slug that is already taken.
      headers:
        X-Request-Id: {$ref: '#/components/headers/RequestId'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: about:blank
            title: Conflict
            status: 409
            detail: The slug payments is already taken in this installation.
            code: slug-taken
            requestId: 9f8e7d6c5b4a39281706f5e4
    PreconditionFailed:
      description: The resource changed since the `ETag` in `If-Match`. Load it again and reapply your change.
      headers:
        X-Request-Id: {$ref: '#/components/headers/RequestId'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: about:blank
            title: Precondition Failed
            status: 412
            detail: Someone saved a newer revision. Merge your changes into it and save again.
            code: edit-conflict
            requestId: 9f8e7d6c5b4a39281706f5e4
    PreconditionRequired:
      description: This request needs an `If-Match` header.
      headers:
        X-Request-Id: {$ref: '#/components/headers/RequestId'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: about:blank
            title: Precondition Required
            status: 428
            detail: Send the spec's current ETag in If-Match.
            code: if-match-required
            requestId: 9f8e7d6c5b4a39281706f5e4
    ContentTooLarge:
      description: The request body is larger than the installation allows.
      headers:
        X-Request-Id: {$ref: '#/components/headers/RequestId'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: about:blank
            title: Request Entity Too Large
            status: 413
            detail: The document is larger than 10 MiB.
            code: document-too-large
            requestId: 9f8e7d6c5b4a39281706f5e4
    LastOwner:
      description: The change would leave the workspace without an owner.
      headers:
        X-Request-Id: {$ref: '#/components/headers/RequestId'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: about:blank
            title: Conflict
            status: 409
            detail: A workspace needs at least one owner. Make someone else an owner first.
            code: last-owner
            requestId: 9f8e7d6c5b4a39281706f5e4
    InvitationNotFound:
      description: The invitation link is wrong, expired or already used.
      headers:
        X-Request-Id: {$ref: '#/components/headers/RequestId'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: about:blank
            title: Not Found
            status: 404
            detail: This invitation link is wrong, expired or already used. Ask for a new one.
            code: invitation-not-found
            requestId: 9f8e7d6c5b4a39281706f5e4
    TooManyRequests:
      description: The caller sent too many requests. Wait for the time in `Retry-After`.
      headers:
        Retry-After: {$ref: '#/components/headers/RetryAfter'}
        X-Request-Id: {$ref: '#/components/headers/RequestId'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: about:blank
            title: Too Many Requests
            status: 429
            detail: Try again in 30 seconds.
            code: rate-limited
            requestId: 9f8e7d6c5b4a39281706f5e4
    Error:
      description: Any other error, such as an unexpected failure on the server.
      headers:
        X-Request-Id: {$ref: '#/components/headers/RequestId'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: about:blank
            title: Internal Server Error
            status: 500
            detail: Something went wrong on the server. Quote the request ID when you report it.
            code: internal-error
            requestId: 9f8e7d6c5b4a39281706f5e4

  schemas:
    WorkspaceId:
      type: string
      description: A workspace ID.
      pattern: '^ws_[0-9a-hjkmnp-tv-z]{26}$'
      examples: [ws_01j9z3kq4m8r2t6v0x5w7y9a1b]
    ProjectId:
      type: string
      description: A project ID.
      pattern: '^prj_[0-9a-hjkmnp-tv-z]{26}$'
      examples: [prj_01j9z3m2p4r6t8v0x2z4b6d8f0]
    EnvironmentId:
      type: string
      description: An environment ID.
      pattern: '^env_[0-9a-hjkmnp-tv-z]{26}$'
      examples: [env_01j9z3n5q7s9v1w3y5a7c9e1g3]
    ServiceId:
      type: string
      description: A service ID.
      pattern: '^svc_[0-9a-hjkmnp-tv-z]{26}$'
      examples: [svc_01j9z3q1s3v5w7y9a1c3e5g7j9]
    SpecId:
      type: string
      description: A spec ID.
      pattern: '^spec_[0-9a-hjkmnp-tv-z]{26}$'
      examples: [spec_01j9z3r4t6v8x0z2b4d6f8h0k2]
    RevisionId:
      type: string
      description: A revision ID.
      pattern: '^rev_[0-9a-hjkmnp-tv-z]{26}$'
      examples: [rev_01j9z3s7v9x1z3b5d7f9h1k3m5]
    UserId:
      type: string
      description: A user ID.
      pattern: '^usr_[0-9a-hjkmnp-tv-z]{26}$'
      examples: [usr_01j9z3kq4m8r2t6v0x5w7y9a1b]
    InvitationId:
      type: string
      description: An invitation ID.
      pattern: '^inv_[0-9a-hjkmnp-tv-z]{26}$'
      examples: [inv_01j9z3v2x4z6b8d0f2h4k6m8p0]
    Timestamp:
      type: string
      format: date-time
      description: A point in time in RFC 3339 format, in UTC.
      examples: ['2026-10-16T12:00:00Z']
    Slug:
      type: string
      description: A short, URL-safe name made of lowercase letters, digits and single hyphens.
      minLength: 1
      maxLength: 63
      pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
      examples: [payments]
    Name:
      type: string
      description: A display name.
      minLength: 1
      maxLength: 100
      examples: [Payments]
    Description:
      type: string
      description: A short description in plain text.
      maxLength: 1000
      examples: ['Checkout, orders and payments.']

    Problem:
      type: object
      description: An RFC 9457 problem details object. Every error response uses it.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          description: Identifies the kind of problem. `about:blank` means the HTTP status says it all.
          examples: [about:blank]
        title:
          type: string
          description: A short summary of the kind of problem.
          examples: [Not Found]
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: The HTTP status code.
          examples: [404]
        detail:
          type: string
          description: What went wrong in this case, and how to fix it.
          examples: [There is no project with this ID.]
        instance:
          type: string
          format: uri-reference
          description: The path of the request that failed.
          examples: [/api/v1/projects/prj_01j9z3m2p4r6t8v0x2z4b6d8f0]
        code:
          type: string
          description: A stable, machine-readable identifier for the problem.
          examples: [not-found]
        requestId:
          type: string
          description: Matches the `X-Request-Id` header and the server logs.
          examples: [9f8e7d6c5b4a39281706f5e4]
        errors:
          type: array
          description: The fields that failed validation.
          maxItems: 100
          items: {$ref: '#/components/schemas/FieldError'}
          examples:
            - - pointer: /slug
                detail: Use lowercase letters, digits and single hyphens.
                code: pattern
    FieldError:
      type: object
      description: One invalid field in a request body.
      required: [pointer, detail]
      properties:
        pointer:
          type: string
          description: A JSON Pointer (RFC 6901) to the field in the request body.
          examples: [/slug]
        detail:
          type: string
          description: What is wrong with the field.
          examples: [Use lowercase letters, digits and single hyphens.]
        code:
          type: string
          description: The rule that failed.
          examples: [pattern]

    Meta:
      type: object
      description: Details of the installation.
      required: [product, version, apiVersion, roles]
      properties:
        product:
          type: string
          description: The product name.
          examples: [Signalbox]
        version:
          type: string
          description: The server version.
          examples: [0.1.0]
        commit:
          type: string
          description: The source commit the server was built from.
          examples: [1a2b3c4d5e6f]
        buildDate:
          type: string
          description: When the server was built.
          examples: ['2026-10-16T12:00:00Z']
        apiVersion:
          type: string
          description: The API's major version.
          examples: [v1]
        roles:
          type: array
          description: The roles this process runs.
          maxItems: 6
          uniqueItems: true
          items: {$ref: '#/components/schemas/Role'}
          examples: [[api, mock]]
    Role:
      type: string
      description: A role of `signalbox-server`.
      enum: [api, mock, runner, scheduler, worker, ingest]
      examples: [api]

    HealthResponse:
      type: object
      description: A health document in the Health Check Response Format for HTTP APIs.
      required: [status]
      properties:
        status: {$ref: '#/components/schemas/HealthStatus'}
        version:
          type: string
          description: The version of the health format.
          examples: ['1']
        releaseId:
          type: string
          description: The server release.
          examples: [0.1.0]
        serviceId:
          type: string
          description: The service that answered.
          examples: [signalbox-server]
        output:
          type: string
          description: Why the status isn't `pass`.
          examples: [shutting down]
        checks:
          type: object
          description: Results per component, keyed by `component:measurement`.
          additionalProperties:
            type: array
            maxItems: 50
            items: {$ref: '#/components/schemas/HealthCheckResult'}
          examples:
            - uptime:
                - componentType: system
                  observedValue: 3600
                  observedUnit: s
                  status: pass
                  time: '2026-10-16T12:00:00Z'
    HealthStatus:
      type: string
      description: '`pass` is healthy, `warn` is healthy with concerns, `fail` is unhealthy.'
      enum: [pass, warn, fail]
      examples: [pass]
    HealthCheckResult:
      type: object
      description: The result of one check.
      required: [status, time]
      properties:
        componentType:
          type: string
          description: The kind of component checked.
          examples: [datastore]
        observedValue:
          type: [number, string, boolean]
          description: The measured value.
          examples: [12]
        observedUnit:
          type: string
          description: The unit of the measured value.
          examples: [ms]
        status: {$ref: '#/components/schemas/HealthStatus'}
        time: {$ref: '#/components/schemas/Timestamp'}
        output:
          type: string
          description: Why the check isn't passing.
          examples: [no answer within 2s]

    Report:
      type: object
      description: The result of validating and linting one document.
      required: [diagnostics, counts]
      properties:
        format: {$ref: '#/components/schemas/SpecFormat'}
        version:
          type: string
          description: The version the document declares. Missing when the document couldn't be read.
          examples: [3.1.0]
        info:
          type: object
          description: What the document's `info` object says. Missing when the document couldn't be read.
          required: [title, version]
          properties:
            title: {type: string, description: '`info.title`.', examples: [Orders API]}
            version: {type: string, description: '`info.version`, the version of the API.', examples: [1.1.0]}
        diagnostics:
          type: array
          description: Every problem found, ordered by position.
          maxItems: 100000
          items: {$ref: '#/components/schemas/Diagnostic'}
          examples:
            - - severity: warning
                source: linter
                code: operation-operationId
                message: The `GET` operation does not contain an `operationId`.
                path: "$.paths['/things'].get"
                range: {start: {line: 7, column: 5}, end: {line: 7, column: 5}}
        counts: {$ref: '#/components/schemas/Counts'}
    SpecFormat:
      type: string
      description: The specification family and minor version.
      enum: [swagger-2.0, openapi-3.0, openapi-3.1, openapi-3.2]
      examples: [openapi-3.1]
    Diagnostic:
      type: object
      description: One problem found in a document.
      required: [severity, source, code, message, range]
      properties:
        severity:
          type: string
          description: How serious the problem is. Errors mean the document is invalid.
          enum: [error, warning, info, hint]
          examples: [error]
        source:
          type: string
          description: The check that found the problem.
          enum: [parser, validator, resolver, linter]
          examples: [resolver]
        code:
          type: string
          description: The kind of problem, or the lint rule ID.
          examples: [unresolved-reference]
        message:
          type: string
          description: What is wrong.
          examples: [Component `#/components/schemas/Missing` does not exist in the specification.]
        path:
          type: string
          description: Where the problem is, as a JSON Pointer or JSONPath.
          examples: ["$.paths['/things'].get"]
        range: {$ref: '#/components/schemas/Range'}
        howToFix:
          type: string
          description: A suggestion for fixing the problem.
          examples: [Check that the referenced component exists and that the $ref is spelled correctly.]
    Range:
      type: object
      description: Where a problem starts and ends in the document.
      required: [start, end]
      properties:
        start: {$ref: '#/components/schemas/Position'}
        end: {$ref: '#/components/schemas/Position'}
    Position:
      type: object
      description: A 1-based line and column. Zero means the position is unknown.
      required: [line, column]
      properties:
        line:
          type: integer
          minimum: 0
          description: The line, starting at 1.
          examples: [14]
        column:
          type: integer
          minimum: 0
          description: The column, starting at 1.
          examples: [17]
    Counts:
      type: object
      description: How many problems there are of each severity.
      required: [errors, warnings, infos, hints]
      properties:
        errors: {type: integer, minimum: 0, description: Problems that make the document invalid., examples: [1]}
        warnings: {type: integer, minimum: 0, description: Quality or security issues., examples: [3]}
        infos: {type: integer, minimum: 0, description: Information worth knowing., examples: [0]}
        hints: {type: integer, minimum: 0, description: Suggestions., examples: [1]}

    User:
      type: object
      description: A person with an account.
      required: [id, email, name]
      properties:
        id: {$ref: '#/components/schemas/UserId'}
        email:
          type: string
          format: email
          description: The user's email address.
          examples: [ada@example.com]
        name: {$ref: '#/components/schemas/Name'}
    SessionCreate:
      type: object
      description: Credentials to sign in with.
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: The account's email address.
          examples: [ada@example.com]
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 1024
          writeOnly: true
          description: The account's password.
          examples: [correct horse battery staple]
    Session:
      type: object
      description: A signed-in session.
      required: [user, expiresAt, csrfToken]
      properties:
        user: {$ref: '#/components/schemas/User'}
        expiresAt: {$ref: '#/components/schemas/Timestamp'}
        csrfToken:
          type: string
          description: Send this in the `X-CSRF-Token` header on unsafe requests.
          examples: [3q2+7wAAAAAAAAAAAAAAAA]
        mfaRequired:
          type: boolean
          description: True when the account must confirm a second factor before the session is usable.
          examples: [false]
    SignInOptions:
      type: object
      description: The ways to sign in besides an email address and password.
      properties:
        sso:
          type: object
          description: Single sign-on through an OpenID Connect identity provider. Missing when it isn't set up.
          required: [name]
          properties:
            name:
              type: string
              description: The provider's name, for the sign-in button.
              examples: [Okta]
          examples:
            - {name: Okta}
    SetupStatus:
      type: object
      description: Whether the installation still needs its first account.
      required: [required]
      properties:
        required:
          type: boolean
          description: True until someone completes first-run setup.
          examples: [true]
    SetupCreate:
      type: object
      description: The setup code and the details of the first admin account.
      required: [setupCode, name, email, password]
      additionalProperties: false
      properties:
        setupCode:
          type: string
          minLength: 1
          maxLength: 128
          description: The code from the server log or from `SIGNALBOX_SETUP_CODE`. Case, spaces and hyphens don't matter.
          examples: [K7QM-2XWP-9D4H-TR6B]
        name: {$ref: '#/components/schemas/Name'}
        email:
          type: string
          format: email
          maxLength: 254
          description: The admin's email address, used to sign in.
          examples: [ada@example.com]
        password: {$ref: '#/components/schemas/NewPassword'}
    NewPassword:
      type: string
      format: password
      minLength: 12
      maxLength: 1024
      writeOnly: true
      description: A new password of at least 12 characters. A few unrelated words make a strong one.
      examples: [correct horse battery staple]

    Workspace:
      type: object
      description: A workspace groups the projects, members and rules of one team or organization unit.
      required: [id, name, slug, role, createdAt, updatedAt]
      properties:
        id: {$ref: '#/components/schemas/WorkspaceId'}
        name: {$ref: '#/components/schemas/Name'}
        slug: {$ref: '#/components/schemas/Slug'}
        role: {$ref: '#/components/schemas/WorkspaceRole'}
        createdAt: {$ref: '#/components/schemas/Timestamp'}
        updatedAt: {$ref: '#/components/schemas/Timestamp'}
    WorkspaceRole:
      type: string
      description: |
        The caller's role in the workspace:

        - `owner` can do everything, including deleting the workspace.
        - `admin` can change the workspace and manage its projects.
        - `editor` can create and change projects.
        - `viewer` can read everything in the workspace.
      enum: [owner, admin, editor, viewer]
      examples: [owner]
    WorkspaceCreate:
      type: object
      description: A new workspace.
      required: [name, slug]
      additionalProperties: false
      properties:
        name: {$ref: '#/components/schemas/Name'}
        slug: {$ref: '#/components/schemas/Slug'}
    WorkspaceUpdate:
      type: object
      description: Changes to a workspace. Fields that aren't sent keep their value.
      minProperties: 1
      additionalProperties: false
      properties:
        name: {$ref: '#/components/schemas/Name'}
        slug: {$ref: '#/components/schemas/Slug'}
    WorkspacePage:
      type: object
      description: One page of the workspace list, with a cursor for the next page.
      required: [data]
      properties:
        data:
          type: array
          description: The workspaces on this page.
          maxItems: 200
          items: {$ref: '#/components/schemas/Workspace'}
          examples:
            - - {id: ws_01j9z3kq4m8r2t6v0x5w7y9a1b, name: Payments, slug: payments, role: owner, createdAt: '2026-10-16T12:00:00Z', updatedAt: '2026-10-16T12:00:00Z'}
        nextCursor: {$ref: '#/components/schemas/NextCursor'}
    NextCursor:
      type: string
      description: Pass this as `cursor` to get the next page. Missing on the last page.
      maxLength: 512
      examples: [eyJpZCI6IndzXzAxajl6M2txNG04cjJ0NnYweDV3N3k5YTFiIn0]
    WorkspaceSummary:
      type: object
      description: A workspace's ID and name, for someone who isn't a member yet.
      required: [id, name]
      properties:
        id: {$ref: '#/components/schemas/WorkspaceId'}
        name: {$ref: '#/components/schemas/Name'}

    Member:
      type: object
      description: A person in a workspace, with their role.
      required: [user, role, joinedAt]
      properties:
        user: {$ref: '#/components/schemas/User'}
        role: {$ref: '#/components/schemas/WorkspaceRole'}
        joinedAt: {$ref: '#/components/schemas/Timestamp'}
    MemberUpdate:
      type: object
      description: A member's new role.
      required: [role]
      additionalProperties: false
      properties:
        role: {$ref: '#/components/schemas/WorkspaceRole'}
    MemberPage:
      type: object
      description: One page of a workspace's members, with a cursor for the next page.
      required: [data]
      properties:
        data:
          type: array
          description: The members on this page.
          maxItems: 200
          items: {$ref: '#/components/schemas/Member'}
          examples:
            - - {user: {id: usr_01j9z3kq4m8r2t6v0x5w7y9a1b, email: ada@example.com, name: Ada Lovelace}, role: owner, joinedAt: '2026-10-16T12:00:00Z'}
        nextCursor: {$ref: '#/components/schemas/NextCursor'}

    Invitation:
      type: object
      description: An open invitation to join a workspace. `invitedBy` is missing when the inviter's account was deleted.
      required: [id, workspaceId, email, role, createdAt, expiresAt]
      properties:
        id: {$ref: '#/components/schemas/InvitationId'}
        workspaceId: {$ref: '#/components/schemas/WorkspaceId'}
        email:
          type: string
          format: email
          description: The only email address that can accept the invitation.
          examples: [grace@example.com]
        role: {$ref: '#/components/schemas/WorkspaceRole'}
        invitedBy: {$ref: '#/components/schemas/UserId'}
        createdAt: {$ref: '#/components/schemas/Timestamp'}
        expiresAt: {$ref: '#/components/schemas/Timestamp'}
    NewInvitation:
      description: An invitation that was just created, with its link. The link can't be retrieved again.
      allOf:
        - $ref: '#/components/schemas/Invitation'
        - type: object
          required: [url]
          properties:
            url:
              type: string
              format: uri
              description: The link to send. The token after `#` stays in the browser and never reaches the server's logs.
              examples: ['https://signalbox.example.com/invite#Zk9vX2JhcjEyMzQ1Njc4OTBhYmNkZWZnaGlqa2xtbm8']
    InvitationCreate:
      type: object
      description: Who to invite, and with which role.
      required: [email, role]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: The email address of the person to invite.
          examples: [grace@example.com]
        role: {$ref: '#/components/schemas/WorkspaceRole'}
    InvitationPage:
      type: object
      description: One page of open invitations, with a cursor for the next page.
      required: [data]
      properties:
        data:
          type: array
          description: The invitations on this page.
          maxItems: 200
          items: {$ref: '#/components/schemas/Invitation'}
          examples:
            - - {id: inv_01j9z3v2x4z6b8d0f2h4k6m8p0, workspaceId: ws_01j9z3kq4m8r2t6v0x5w7y9a1b, email: grace@example.com, role: editor, createdAt: '2026-10-16T12:00:00Z', expiresAt: '2026-10-23T12:00:00Z'}
        nextCursor: {$ref: '#/components/schemas/NextCursor'}
    InvitationToken:
      type: object
      description: The token from an invitation link, the part after `#`.
      required: [token]
      additionalProperties: false
      properties:
        token:
          type: string
          maxLength: 128
          description: The invitation token.
          examples: [Zk9vX2JhcjEyMzQ1Njc4OTBhYmNkZWZnaGlqa2xtbm8]
    InvitationDetails:
      type: object
      description: What an invitation link offers.
      required: [workspace, email, role, expiresAt, accountExists]
      properties:
        workspace: {$ref: '#/components/schemas/WorkspaceSummary'}
        email:
          type: string
          format: email
          description: The email address the invitation was sent to.
          examples: [grace@example.com]
        role: {$ref: '#/components/schemas/WorkspaceRole'}
        invitedBy:
          type: string
          description: The name of the person who sent the invitation. Missing when that account was deleted.
          examples: [Ada Lovelace]
        expiresAt: {$ref: '#/components/schemas/Timestamp'}
        accountExists:
          type: boolean
          description: Whether an account with the email address exists. If it does, sign in and accept; if not, sign up with the invitation.
          examples: [false]
    InvitationSignUp:
      type: object
      description: The invitation token and the new account's details.
      required: [token, name, password]
      additionalProperties: false
      properties:
        token:
          type: string
          maxLength: 128
          description: The token from the invitation link the person received.
          examples: [Zk9vX2JhcjEyMzQ1Njc4OTBhYmNkZWZnaGlqa2xtbm8]
        name: {$ref: '#/components/schemas/Name'}
        password: {$ref: '#/components/schemas/NewPassword'}

    Project:
      type: object
      description: A project is one system, such as a product or a platform, with its own canvas, environments and services.
      required: [id, workspaceId, name, createdAt, updatedAt]
      properties:
        id: {$ref: '#/components/schemas/ProjectId'}
        workspaceId: {$ref: '#/components/schemas/WorkspaceId'}
        name: {$ref: '#/components/schemas/Name'}
        description: {$ref: '#/components/schemas/Description'}
        createdAt: {$ref: '#/components/schemas/Timestamp'}
        updatedAt: {$ref: '#/components/schemas/Timestamp'}
    ProjectCreate:
      type: object
      description: A new project.
      required: [name]
      additionalProperties: false
      properties:
        name: {$ref: '#/components/schemas/Name'}
        description: {$ref: '#/components/schemas/Description'}
    ProjectUpdate:
      type: object
      description: Changes to a project. Fields that aren't sent keep their value.
      minProperties: 1
      additionalProperties: false
      properties:
        name: {$ref: '#/components/schemas/Name'}
        description:
          description: The new description. Send `null` or an empty string to remove it.
          examples: ['Checkout, orders, payments and refunds.']
          anyOf:
            - {$ref: '#/components/schemas/Description'}
            - {type: 'null'}
    ProjectPage:
      type: object
      description: One page of the project list, with a cursor for the next page.
      required: [data]
      properties:
        data:
          type: array
          description: The projects on this page.
          maxItems: 200
          items: {$ref: '#/components/schemas/Project'}
          examples:
            - - {id: prj_01j9z3m2p4r6t8v0x2z4b6d8f0, workspaceId: ws_01j9z3kq4m8r2t6v0x5w7y9a1b, name: Shop, createdAt: '2026-10-16T12:00:00Z', updatedAt: '2026-10-16T12:00:00Z'}
        nextCursor: {$ref: '#/components/schemas/NextCursor'}

    Environment:
      type: object
      description: An environment of a project, with its own base URLs, variables and secrets.
      required: [id, projectId, name, slug, kind, position, createdAt, updatedAt]
      properties:
        id: {$ref: '#/components/schemas/EnvironmentId'}
        projectId: {$ref: '#/components/schemas/ProjectId'}
        name: {$ref: '#/components/schemas/Name'}
        slug: {$ref: '#/components/schemas/Slug'}
        kind: {$ref: '#/components/schemas/EnvironmentKind'}
        position:
          type: integer
          minimum: 0
          description: The environment's place in the environment switcher, starting at 0.
          examples: [2]
        createdAt: {$ref: '#/components/schemas/Timestamp'}
        updatedAt: {$ref: '#/components/schemas/Timestamp'}
    EnvironmentKind:
      type: string
      description: What the environment is for. Production environments get extra confirmation before destructive actions.
      enum: [development, staging, production, other]
      examples: [production]
    EnvironmentCreate:
      type: object
      description: A new environment.
      required: [name, slug, kind]
      additionalProperties: false
      properties:
        name: {$ref: '#/components/schemas/Name'}
        slug: {$ref: '#/components/schemas/Slug'}
        kind: {$ref: '#/components/schemas/EnvironmentKind'}
    EnvironmentUpdate:
      type: object
      description: Changes to an environment. Fields that aren't sent keep their value.
      minProperties: 1
      additionalProperties: false
      properties:
        name: {$ref: '#/components/schemas/Name'}
        slug: {$ref: '#/components/schemas/Slug'}
        kind: {$ref: '#/components/schemas/EnvironmentKind'}
        position:
          type: integer
          minimum: 0
          description: The new place in the environment switcher.
          examples: [0]
    EnvironmentPage:
      type: object
      description: One page of the environment list, with a cursor for the next page.
      required: [data]
      properties:
        data:
          type: array
          description: The environments on this page.
          maxItems: 200
          items: {$ref: '#/components/schemas/Environment'}
          examples:
            - - {id: env_01j9z3n5q7s9v1w3y5a7c9e1g3, projectId: prj_01j9z3m2p4r6t8v0x2z4b6d8f0, name: Production, slug: production, kind: production, position: 2, createdAt: '2026-10-16T12:00:00Z', updatedAt: '2026-10-16T12:00:00Z'}
        nextCursor: {$ref: '#/components/schemas/NextCursor'}

    Service:
      type: object
      description: A service on a project's canvas.
      required: [id, projectId, name, slug, position, createdAt, updatedAt]
      properties:
        id: {$ref: '#/components/schemas/ServiceId'}
        projectId: {$ref: '#/components/schemas/ProjectId'}
        name: {$ref: '#/components/schemas/Name'}
        slug: {$ref: '#/components/schemas/Slug'}
        description: {$ref: '#/components/schemas/Description'}
        telemetryServiceName: {$ref: '#/components/schemas/TelemetryServiceName'}
        position: {$ref: '#/components/schemas/CanvasPosition'}
        createdAt: {$ref: '#/components/schemas/Timestamp'}
        updatedAt: {$ref: '#/components/schemas/Timestamp'}
    CanvasPosition:
      type: object
      description: Where the node sits on the canvas, in canvas units.
      required: [x, y]
      properties:
        x: {type: number, description: Horizontal position., examples: [320]}
        y: {type: number, description: Vertical position., examples: [120]}
    TelemetryServiceName:
      type: string
      maxLength: 255
      description: The `service.name` a service reports in its traces. It links the service's spans to its node on the canvas.
      examples: [orders-api]
    ServiceCreate:
      type: object
      description: A new service.
      required: [name, slug]
      additionalProperties: false
      properties:
        name: {$ref: '#/components/schemas/Name'}
        slug: {$ref: '#/components/schemas/Slug'}
        description: {$ref: '#/components/schemas/Description'}
        telemetryServiceName: {$ref: '#/components/schemas/TelemetryServiceName'}
        position: {$ref: '#/components/schemas/CanvasPosition'}
    ServiceUpdate:
      type: object
      description: Changes to a service. Fields that aren't sent keep their value.
      minProperties: 1
      additionalProperties: false
      properties:
        name: {$ref: '#/components/schemas/Name'}
        slug: {$ref: '#/components/schemas/Slug'}
        description: {$ref: '#/components/schemas/Description'}
        telemetryServiceName: {$ref: '#/components/schemas/TelemetryServiceName'}
        position: {$ref: '#/components/schemas/CanvasPosition'}
    ServicePage:
      type: object
      description: One page of the service list, with a cursor for the next page.
      required: [data]
      properties:
        data:
          type: array
          description: The services on this page.
          maxItems: 200
          items: {$ref: '#/components/schemas/Service'}
          examples:
            - - {id: svc_01j9z3q1s3v5w7y9a1c3e5g7j9, projectId: prj_01j9z3m2p4r6t8v0x2z4b6d8f0, name: orders-api, slug: orders-api, position: {x: 320, y: 120}, createdAt: '2026-10-16T12:00:00Z', updatedAt: '2026-10-16T12:00:00Z'}
        nextCursor: {$ref: '#/components/schemas/NextCursor'}

    Spec:
      type: object
      description: An OpenAPI document of a service. Its content lives in revisions.
      required: [id, serviceId, name, createdAt, updatedAt]
      properties:
        id: {$ref: '#/components/schemas/SpecId'}
        serviceId: {$ref: '#/components/schemas/ServiceId'}
        name: {$ref: '#/components/schemas/Name'}
        currentRevisionId: {$ref: '#/components/schemas/RevisionId'}
        createdAt: {$ref: '#/components/schemas/Timestamp'}
        updatedAt: {$ref: '#/components/schemas/Timestamp'}
    SpecCreate:
      type: object
      description: A new spec and the content of its first revision.
      required: [name, content]
      additionalProperties: false
      properties:
        name: {$ref: '#/components/schemas/Name'}
        content: {$ref: '#/components/schemas/SpecContent'}
    SpecUpdate:
      type: object
      description: Changes to a spec. Fields that aren't sent keep their value.
      minProperties: 1
      additionalProperties: false
      properties:
        name: {$ref: '#/components/schemas/Name'}
    SpecContent:
      type: string
      description: The full OpenAPI document as YAML or JSON text.
      minLength: 1
      maxLength: 10485760
      examples: ["openapi: 3.1.1\ninfo:\n  title: Orders API\n  version: 1.0.0\npaths: {}\n"]
    SpecPage:
      type: object
      description: One page of the spec list, with a cursor for the next page.
      required: [data]
      properties:
        data:
          type: array
          description: The specs on this page.
          maxItems: 200
          items: {$ref: '#/components/schemas/Spec'}
          examples:
            - - {id: spec_01j9z3r4t6v8x0z2b4d6f8h0k2, serviceId: svc_01j9z3q1s3v5w7y9a1c3e5g7j9, name: Orders API, createdAt: '2026-10-16T12:00:00Z', updatedAt: '2026-10-16T12:00:00Z'}
        nextCursor: {$ref: '#/components/schemas/NextCursor'}

    Revision:
      type: object
      description: One saved version of a spec's document. Revisions never change.
      required: [id, specId, number, format, version, sizeBytes, sha256, counts, createdBy, createdAt]
      properties:
        id: {$ref: '#/components/schemas/RevisionId'}
        specId: {$ref: '#/components/schemas/SpecId'}
        number:
          type: integer
          minimum: 1
          description: The revision's sequence number within the spec, starting at 1.
          examples: [3]
        message:
          type: string
          maxLength: 500
          description: What changed, in the author's words.
          examples: [Add refunds]
        format: {$ref: '#/components/schemas/SpecFormat'}
        version:
          type: string
          description: The OpenAPI version the document declares.
          examples: [3.1.1]
        title:
          type: string
          maxLength: 1000
          description: The document's `info.title`.
          examples: [Orders API]
        apiVersion:
          type: string
          maxLength: 1000
          description: The document's `info.version`, the version of the API it describes.
          examples: [1.1.0]
        sizeBytes:
          type: integer
          minimum: 0
          description: The size of the document in bytes.
          examples: [18342]
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: The SHA-256 hash of the document.
          examples: [9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08]
        counts: {$ref: '#/components/schemas/Counts'}
        createdBy: {$ref: '#/components/schemas/UserId'}
        createdAt: {$ref: '#/components/schemas/Timestamp'}
    RevisionCreate:
      type: object
      description: The content of a new revision.
      required: [content]
      additionalProperties: false
      properties:
        content: {$ref: '#/components/schemas/SpecContent'}
        message:
          type: string
          maxLength: 500
          description: A short note on what changed, shown in the revision history.
          examples: [Add refunds]
    RevisionPage:
      type: object
      description: One page of the revision history, with a cursor for the next page.
      required: [data]
      properties:
        data:
          type: array
          description: The revisions on this page.
          maxItems: 200
          items: {$ref: '#/components/schemas/Revision'}
          examples:
            - - {id: rev_01j9z3s7v9x1z3b5d7f9h1k3m5, specId: spec_01j9z3r4t6v8x0z2b4d6f8h0k2, number: 2, format: openapi-3.1, version: 3.1.1, sizeBytes: 18342, sha256: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08, counts: {errors: 0, warnings: 3, infos: 0, hints: 1}, createdBy: usr_01j9z3kq4m8r2t6v0x5w7y9a1b, createdAt: '2026-10-16T12:00:00Z'}
        nextCursor: {$ref: '#/components/schemas/NextCursor'}
