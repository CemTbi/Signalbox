      summary: List a spec's published versions
      description: Lists the versions, newest first.
      tags: [Specs]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of versions.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VersionPage'}
              example:
                data:
                  - id: ver_01j9z3v2x4z6b8d0f2h4k6m8p0
                    specId: spec_01j9z3r4t6v8x0z2b4d6f8h0k2
                    name: 1.4.0
                    revisionId: rev_01j9z3s7v9x1z3b5d7f9h1k3m5
                    revisionNumber: 7
                    apiVersion: 1.4.0
                    notes: Adds refunds.
                    publishedBy: usr_01j9z3kq4m8r2t6v0x5w7y9a1b
                    publishedAt: '2026-10-17T12:00:00Z'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: publishVersion
      summary: Publish a version
      description: |
        Publishes a revision under a name, such as `1.4.0`. Mocks, docs and code generation serve published versions. Versions never change, and a name is used once per spec.

        A revision with errors can't be published: the request fails with 422 and the code `spec-has-errors`. Warnings don't block publishing.
      tags: [Specs]
      requestBody:
        required: true
        description: What to publish. Every field is optional.
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VersionCreate'}
            example:
