  /api/v1/environments/{environmentId}/variables:
    parameters:
      - $ref: '#/components/parameters/EnvironmentId'
    get:
      operationId: getVariables
      summary: Get an environment's variables
      description: |
        Returns the environment's variables, in order. Every member of the workspace may. Secrets are write-only: they come back without their values.

        The `ETag` names this version of the whole set; send it as `If-Match` when you replace them.
      tags: [Environments]
      responses:
        '200':
          description: The variables.
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EnvironmentVariables'}
              example:
                environmentId: env_01j9z3n5q7s9v1w3y5a7c9e1g3
                variables: [{key: baseUrl, value: 'https://api.example.com', secret: false}, {key: apiKey, secret: true}]
                updatedAt: '2026-10-18T12:00:00Z'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Error'}
    put:
      operationId: putVariables
      summary: Replace an environment's variables
      description: |
        Replaces the environment's variables with the ones sent, in their order. Owners, admins and editors may.

        Secret values are encrypted with the workspace's key and never returned. Send a secret without `value` to keep the value it has. Storing a new secret needs the server's secret key (`SIGNALBOX_SECRET_KEY`); without it the request fails with `secrets-unavailable`.
      tags: [Environments]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        description: Every variable the environment keeps.
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EnvironmentVariablesPut'}
            example: {variables: [{key: baseUrl, value: 'https://api.example.com'}, {key: apiKey, value: sk_live_123, secret: true}]}
      responses:
        '200':
          description: The variables as stored.
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EnvironmentVariables'}
              example:
                environmentId: env_01j9z3n5q7s9v1w3y5a7c9e1g3
                variables: [{key: baseUrl, value: 'https://api.example.com', secret: false}, {key: apiKey, secret: true}]
                updatedAt: '2026-10-18T12:00:00Z'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '503': {$ref: '#/components/responses/SecretsUnavailable'}
        default: {$ref: '#/components/responses/Error'}

  /api/v1/projects/{projectId}/canvas:
    parameters:
