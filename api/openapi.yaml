  /api/v1/projects/{projectId}/collection-imports:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: importCollection
      summary: Import a Postman collection
      description: |
        Imports a Postman Collection v2.1 or v2.0 file as a new collection, with its folders, requests, variables and scripts, and reports what will run differently and what was left out. Owners, admins and editors may.

        Auth a request inherits from its folder or the collection is copied onto the request. Scripts are kept but never run during an import.
      tags: [Client]
      parameters:
        - name: dryRun
          in: query
          required: false
          description: true checks the file and returns the report without importing it.
          schema: {type: boolean}
          example: true
      requestBody:
        required: true
        description: The Postman collection file.
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PostmanFile'}
            example: {info: {name: Shop API, schema: 'https://schema.getpostman.com/json/collection/v2.1.0/collection.json'}, item: [{name: Get an order, request: {method: GET, url: '{{baseUrl}}/orders/1'}}]}
      responses:
        '200':
          description: The report of a dry run.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CollectionImport'}
              example: {report: {clean: true, folders: 0, requests: 1, variables: 0, notes: []}}
        '201':
          description: The imported collection, and the report.
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
            Location: {$ref: '#/components/headers/Location'}
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CollectionImport'}
              example:
                collection: {id: col_01j9z3w5y7a9c1e3g5j7m9p1r3, projectId: prj_01j9z3m2p4r6t8v0x2z4b6d8f0, name: Shop API, variables: [], createdAt: '2026-10-19T12:00:00Z', updatedAt: '2026-10-19T12:00:00Z'}
                report: {clean: true, folders: 0, requests: 1, variables: 0, notes: []}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/ContentTooLarge'}
        '422': {$ref: '#/components/responses/NotImportable'}
        default: {$ref: '#/components/responses/Error'}
