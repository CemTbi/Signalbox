      responses:
        '204':
          description: The services moved.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/projects/{projectId}/send:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: sendRequest
      summary: Send a request
      description: |
        Sends an HTTP request from the server on your behalf, and keeps it in your history. Owners, admins and editors may.

        The runner never reaches Signalbox's own database, cloud metadata endpoints or loopback; an admin can deny or allow more. A request that gets no response, because it was refused, the host doesn't exist, the connection failed or it timed out, still answers `200`, with `failure` saying why.

        With `itemId`, the saved request's collection's and folders' pre-request and test scripts run around it, and the collection's variables fill in `{{name}}` where the environment has none. `scripts` are the request's own, as the editor has them; without them, the saved request's run. Pre-request scripts run first, and a failing one stops the request (`failure.code` is `script`). Test scripts run against the response. Variables scripts set last for the send; they aren't saved.

        With `environmentId`, the environment's variables fill in `{{name}}` in the URL, headers and body first, as do the built-ins `{{$guid}}`, `{{$timestamp}}`, `{{$isoTimestamp}}` and `{{$randomInt}}`. A variable's value may name other variables; a secret's is used as it is. Names with no value are sent as they are and listed in `unresolved`.

        History keeps credential headers (`Authorization`, `Proxy-Authorization`, `Cookie`) as `•••`, and the first megabyte of the response body. The environment's secret values are `•••` wherever they appear in what history keeps.
      tags: [Client]
      requestBody:
        required: true
        description: The request to send.
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SendRequest'}
            example: {environmentId: env_01j9z3n5q7s9v1w3y5a7c9e1g3, method: GET, url: '{{baseUrl}}/orders/42', headers: [{key: Accept, value: application/json}]}
      responses:
        '200':
          description: What came of the request.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
            Location: {$ref: '#/components/headers/Location'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HistoryEntry'}
              example:
                id: hist_01j9z3w5y7a9c1e3g5j7m9p1r3
                environmentId: env_01j9z3n5q7s9v1w3y5a7c9e1g3
                method: GET
                url: 'https://api.example.com/orders/42'
                sentAt: '2026-10-18T12:00:00Z'
                request: {headers: [{key: Accept, value: application/json}]}
                response: {status: 200, statusText: OK, proto: HTTP/2.0, headers: [{key: Content-Type, value: application/json}], body: '{"id":42}', bodyEncoding: text, size: 9, truncated: false, url: 'https://api.example.com/orders/42', redirects: 0, remoteAddress: '203.0.113.7:443'}
                timings: {dnsMs: 4.1, connectMs: 12.3, tlsMs: 25.8, firstByteMs: 40.2, downloadMs: 0.3, totalMs: 83.5}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422':
          description: Once its variables are filled in, the request is larger than the runner sends (`request-too-large`).
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              example: {type: about:blank, title: Unprocessable Content, status: 422, code: request-too-large, detail: 'Once its variables are filled in, the request is larger than the runner sends. Check for variables that name each other.'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503':
          description: This server doesn't run the runner role (`runner-unavailable`), or can't read the environment's secrets (`secrets-unavailable`, `secret-key-changed`).
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              example: {type: about:blank, title: Service Unavailable, status: 503, code: runner-unavailable, detail: "This server doesn't run the runner role, which sends requests. Run signalbox-server with --roles=all."}
        default: {$ref: '#/components/responses/Error'}
