    put:
      operationId: placeServices
      summary: Move services on the canvas
      description: |
        Sets where services' nodes are on the project's canvas, such as after someone drags one or arranges the canvas automatically. Owners, admins and editors may.

        Layout isn't an edit of the services: their ETags stay the same, so it needs no `If-Match`, and the last move wins. The move is all or nothing; if a service isn't in the project, nothing moves.
