openapi: 3.1.1
info:
  title: Signalbox API
  version: 0.1.0
  summary: Manage workspaces, projects, services and API specs, and check OpenAPI documents.
  description: |
    The Signalbox REST API. The web app and the `signalbox` CLI use only this API.

    Conventions, decided in ADR-0005:

    - JSON with camelCase field names; optional fields are omitted when empty.
    - IDs are opaque strings with a type prefix, such as `ws_` or `prj_`.
    - Lists are paginated with `limit` and `cursor`, and return `data` and `nextCursor`.
    - Every error is an RFC 9457 problem document with a stable `code` and the `requestId`.
    - Resources people edit carry an `ETag`; send it back in `If-Match` to avoid overwriting someone else's change.
    - `POST` requests that create something accept an `Idempotency-Key`.

    Operations marked `x-signalbox-status: planned` are part of the contract but not implemented yet.
  contact:
    name: Signalbox maintainers
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: '{scheme}://{host}'
    description: Your Signalbox installation
    variables:
      scheme:
        default: https
        enum: [https, http]
        description: Use https outside local development.
      host:
        default: localhost:8080
        description: Host name and port of the installation.
security:
  - sessionCookie: []
  - bearerToken: []
tags:
  - name: Meta
    description: Information about the installation.
  - name: Health
    description: Liveness and readiness in the Health Check Response Format for HTTP APIs.
  - name: Spec checks
    description: Validate and lint OpenAPI documents without storing them.
  - name: Sessions
    description: Sign in and out of the web app.
  - name: Workspaces
    description: Workspaces group the projects, members and rules of one team or organization unit.
  - name: Members
    description: The people in a workspace and their roles.
  - name: Invitations
    description: Links that bring people into a workspace. They work without email, once, for 7 days.
  - name: Projects
    description: A project is one system, shown as one canvas.
  - name: Environments
    description: Development, staging, production and other environments of a project.
  - name: Services
    description: Services are the nodes on a project's canvas.
  - name: Specs
    description: OpenAPI documents of a service and their revisions.

paths:
  /livez:
    get:
      operationId: getLiveness
      summary: Check that the process is running
      description: Answers as long as the process runs. It never checks dependencies, so a slow database can't make an orchestrator restart a healthy process.
      tags: [Health]
      security: []
      responses:
        '200':
          description: The process is running.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/health+json:
              schema: {$ref: '#/components/schemas/HealthResponse'}
              example:
                status: pass
                version: '1'
                releaseId: 0.1.0
                serviceId: signalbox-server

  /readyz:
    get:
      operationId: getReadiness
      summary: Check that the server can take traffic
      description: Runs every registered check. Fails with 503 when a critical dependency is down or the server is shutting down; a failing non-critical check makes the status `warn`.
      tags: [Health]
      security: []
      responses:
        '200':
          description: Ready, possibly with warnings.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/health+json:
              schema: {$ref: '#/components/schemas/HealthResponse'}
              example:
                status: pass
                version: '1'
                releaseId: 0.1.0
                serviceId: signalbox-server
                checks:
                  uptime:
                    - componentType: system
                      observedValue: 3600
                      observedUnit: s
                      status: pass
                      time: '2026-10-16T12:00:00Z'
        '503':
          description: Not ready. Load balancers should stop sending traffic.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/health+json:
              schema: {$ref: '#/components/schemas/HealthResponse'}
              example:
                status: fail
                version: '1'
                releaseId: 0.1.0
                serviceId: signalbox-server
                output: shutting down

  /api/v1/meta:
    get:
      operationId: getMeta
      summary: Describe the installation
      description: Returns the product version and the roles this process runs.
      tags: [Meta]
      security: []
      responses:
        '200':
          description: The installation's details.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Meta'}
              example:
                product: Signalbox
                version: 0.1.0
                commit: 1a2b3c4d5e6f
                buildDate: '2026-10-16T12:00:00Z'
                apiVersion: v1
                roles: [api]
        default: {$ref: '#/components/responses/Error'}

  /api/v1/spec-checks:
    post:
      operationId: checkSpec
      summary: Validate and lint an OpenAPI document
      description: |
        Checks the document sent as the request body and returns every problem with its line and column. Nothing is stored.

        A document with errors still gets a `200` response: the check worked, and the report lists the errors. File and remote `$ref`s are never followed.
      tags: [Spec checks]
      parameters:
        - name: ruleSets
          in: query
          required: false
          description: Comma-separated lint rule sets. `none` validates without linting.
          schema:
            type: string
            default: recommended
            pattern: '^(recommended|owasp|all|none)(,(recommended|owasp|all|none))*$'
          example: recommended,owasp
      requestBody:
        required: true
        description: The OpenAPI or Swagger document, as YAML or JSON.
        content:
          application/yaml:
            schema: {type: string, maxLength: 10485760}
            example: |
              openapi: 3.1.1
              info:
                title: Pets
                version: 1.0.0
              paths: {}
          application/json:
            schema: {type: string, maxLength: 10485760}
            example: '{"openapi": "3.1.1", "info": {"title": "Pets", "version": "1.0.0"}, "paths": {}}'
      responses:
        '200':
          description: The check ran. The report lists every problem found.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Report'}
              example:
                format: openapi-3.1
                version: 3.1.0
                diagnostics:
                  - severity: error
                    source: resolver
                    code: unresolved-reference
                    message: Component `#/components/schemas/Missing` does not exist in the specification.
                    path: $.components.schemas['Missing']
                    range:
                      start: {line: 14, column: 17}
                      end: {line: 14, column: 17}
                    howToFix: Check that the referenced component exists and that the $ref is spelled correctly.
                counts: {errors: 1, warnings: 0, infos: 0, hints: 0}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '413': {$ref: '#/components/responses/ContentTooLarge'}
        '422':
          description: The document took longer than 30 seconds to check.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              example:
                type: about:blank
                title: Unprocessable Entity
                status: 422
                detail: Checking the document took longer than 30s.
                code: check-timeout
                requestId: 9f8e7d6c5b4a39281706f5e4
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/Error'}

  /api/v1/setup:
    get:
      operationId: getSetupStatus
      summary: Check whether first-run setup is needed
      description: A new installation has no accounts. Until someone completes setup, `required` is true and the web app shows the setup page.
      tags: [Sessions]
      security: []
      responses:
        '200':
          description: Whether setup is needed.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SetupStatus'}
              example: {required: true}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: completeSetup
      summary: Create the first admin account
      description: |
        Creates the installation's first account, an admin, and signs it in. It needs the setup code that the server writes to its log at startup, or the one set in `SIGNALBOX_SETUP_CODE`, so that whoever reaches a new installation first can't claim it.

        Works only while the installation has no accounts.
      tags: [Sessions]
      security: []
      requestBody:
        required: true
        description: The setup code and the first admin's details.
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SetupCreate'}
            example:
              setupCode: K7QM-2XWP-9D4H-TR6B
              name: Ada Lovelace
              email: ada@example.com
              password: correct horse battery staple
      responses:
        '201':
          description: Setup is complete and the admin is signed in.
          headers:
            Set-Cookie:
              description: The new admin's session cookie.
              schema: {type: string}
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
              example:
                user: {id: usr_01j9z3kq4m8r2t6v0x5w7y9a1b, email: ada@example.com, name: Ada Lovelace}
                expiresAt: '2026-10-23T12:00:00Z'
                csrfToken: Zk9vX2JhcjEyMzQ1Njc4OTBhYmNkZWZnaGlqa2xtbm8
        '400': {$ref: '#/components/responses/BadRequest'}
        '403':
          description: The setup code is wrong, or the request came from another site.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              example:
                type: about:blank
                title: Forbidden
                status: 403
                detail: The setup code is wrong. The server writes it to its log at startup.
                code: invalid-setup-code
                requestId: 9f8e7d6c5b4a39281706f5e4
        '409':
          description: The installation already has accounts. Sign in instead.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              example:
                type: about:blank
                title: Conflict
                status: 409
                detail: Signalbox is already set up. Sign in instead.
                code: setup-complete
                requestId: 9f8e7d6c5b4a39281706f5e4
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/Error'}

  /api/v1/sessions:
    post:
      operationId: createSession
      summary: Sign in
      description: |
        Signs in with an email address and password, and sets the session cookie. Accounts with a second factor get `mfaRequired` and finish signing in with the factor.

        Browsers send the `Origin` header themselves. Other clients must send `Origin` with the installation's public URL, such as `https://signalbox.example.com`.
      tags: [Sessions]
      security: []
      requestBody:
        required: true
        description: The email address and password to sign in with.
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SessionCreate'}
            example:
              email: ada@example.com
              password: correct horse battery staple
      responses:
        '201':
          description: Signed in.
          headers:
            Set-Cookie:
              description: The session cookie.
              schema: {type: string}
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
              example:
                user: {id: usr_01j9z3kq4m8r2t6v0x5w7y9a1b, email: ada@example.com, name: Ada Lovelace}
                expiresAt: '2026-10-23T12:00:00Z'
                csrfToken: Zk9vX2JhcjEyMzQ1Njc4OTBhYmNkZWZnaGlqa2xtbm8
        '400': {$ref: '#/components/responses/BadRequest'}
        '401':
          description: The email address or password is wrong.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                detail: The email address or password is wrong.
                code: invalid-credentials
                requestId: 9f8e7d6c5b4a39281706f5e4
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/Error'}

  /api/v1/sign-in-options:
    get:
      operationId: getSignInOptions
      summary: List the ways to sign in
      description: Says whether single sign-on is set up, so the sign-in page can offer it. Signing in with an email address and password always works for accounts that have a password.
      tags: [Sessions]
      security: []
      responses:
        '200':
          description: The ways to sign in.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SignInOptions'}
              example: {sso: {name: Okta}}
        default: {$ref: '#/components/responses/Error'}

  /api/v1/sso/start:
    get:
      operationId: startSingleSignOn
      summary: Start signing in through the identity provider
      description: |
        A browser navigation, not an API call. It redirects to the OpenID Connect identity provider, using the authorization code flow with PKCE, and sets a short-lived cookie that ties the sign-in to this browser. The provider sends the browser back to `/api/v1/sso/callback`.

        If single sign-on can't start, it redirects to `/sign-in?sso=<reason>` instead, where the reason is `rate-limited`, `unavailable` or `failed`. On an installation without accounts it redirects to `/setup`: the first account comes from first-run setup.
      tags: [Sessions]
      security: []
      parameters:
        - name: return
          in: query
          required: false
          description: A path on this site to open after signing in. Anything that isn't a path on this site is replaced with `/`.
          schema: {type: string, maxLength: 2048}
          example: /projects/prj_01j9z3m2p4r6t8v0x2z4b6d8f0
      responses:
        '302':
          description: Continue at the identity provider, or at the sign-in or setup page if single sign-on can't start.
          headers:
            Location: {$ref: '#/components/headers/Location'}
            Set-Cookie:
              description: The cookie that ties the sign-in to this browser, for 10 minutes.
              schema: {type: string}
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
        '404':
          description: Single sign-on isn't set up on this installation.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              example:
                type: about:blank
                title: Not Found
                status: 404
                detail: Single sign-on isn't set up on this installation.
                code: sso-disabled
                requestId: 9f8e7d6c5b4a39281706f5e4
        default: {$ref: '#/components/responses/Error'}

  /api/v1/sso/callback:
    get:
      operationId: finishSingleSignOn
      summary: Come back from the identity provider
      description: |
        Where the identity provider sends the browser after the person signs in. Signalbox checks the provider's answer, signs the person in, and redirects to the path the sign-in started from. Someone signing in for the first time gets an account, if the provider vouches for their email address and no account has it; accounts are never linked by email address alone.

        On failure it redirects to `/sign-in?sso=<reason>`, where the reason is `expired`, `failed`, `denied`, `unavailable`, `email-unverified`, `not-allowed` or `account-exists`.
      tags: [Sessions]
      security: []
      parameters:
        - name: state
          in: query
          required: false
          description: The state Signalbox sent to the provider.
          schema: {type: string, maxLength: 128}
          example: Zk9vX2JhcjEyMzQ1Njc4OTBhYmNkZWZnaGlqa2xtbm8
        - name: code
          in: query
          required: false
          description: The authorization code from the provider.
          schema: {type: string, maxLength: 2048}
          example: SplxlOBeZQQYbYS6WxSbIA
        - name: error
          in: query
          required: false
          description: The provider's error code, when the sign-in didn't succeed.
          schema: {type: string, maxLength: 256}
          example: access_denied
        - name: error_description
          in: query
          required: false
          description: The provider's explanation of the error.
          schema: {type: string, maxLength: 2048}
          example: The user cancelled the sign-in.
      responses:
        '302':
          description: Signed in and on the way to the page the sign-in started from, or on the way to the page that explains why it failed.
          headers:
            Location: {$ref: '#/components/headers/Location'}
            Set-Cookie:
              description: The session cookie, after a successful sign-in.
              schema: {type: string}
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
        default: {$ref: '#/components/responses/Error'}

  /api/v1/sessions/current:
    get:
      operationId: getCurrentSession
      summary: Get the current session
      description: Returns the signed-in session with its CSRF token. The web app calls this when it loads, because the session cookie itself can't be read by scripts.
      tags: [Sessions]
      responses:
        '200':
          description: The current session.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
              example:
                user: {id: usr_01j9z3kq4m8r2t6v0x5w7y9a1b, email: ada@example.com, name: Ada Lovelace}
                expiresAt: '2026-10-23T12:00:00Z'
                csrfToken: Zk9vX2JhcjEyMzQ1Njc4OTBhYmNkZWZnaGlqa2xtbm8
        '401': {$ref: '#/components/responses/Unauthorized'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteCurrentSession
      summary: Sign out
      description: Ends the current session on the server and clears the cookie.
      tags: [Sessions]
      responses:
        '204':
          description: Signed out.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        default: {$ref: '#/components/responses/Error'}

  /api/v1/me:
    get:
      operationId: getCurrentUser
      summary: Get the signed-in user
      description: Returns the user that the session or token belongs to.
      tags: [Sessions]
      responses:
        '200':
          description: The signed-in user.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
              example: {id: usr_01j9z3kq4m8r2t6v0x5w7y9a1b, email: ada@example.com, name: Ada Lovelace}
        '401': {$ref: '#/components/responses/Unauthorized'}
        default: {$ref: '#/components/responses/Error'}

  /api/v1/workspaces:
    get:
      operationId: listWorkspaces
      summary: List workspaces
      description: Lists the workspaces the caller is a member of, oldest first.
      tags: [Workspaces]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of workspaces.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkspacePage'}
              example:
                data:
                  - id: ws_01j9z3kq4m8r2t6v0x5w7y9a1b
                    name: Payments
                    slug: payments
                    role: owner
                    createdAt: '2026-10-16T12:00:00Z'
                    updatedAt: '2026-10-16T12:00:00Z'
                nextCursor: eyJpZCI6IndzXzAxajl6M2txNG04cjJ0NnYweDV3N3k5YTFiIn0
        '401': {$ref: '#/components/responses/Unauthorized'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createWorkspace
      summary: Create a workspace
      description: Creates a workspace and makes the caller its owner.
      tags: [Workspaces]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        description: The new workspace's name and slug.
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorkspaceCreate'}
            example: {name: Payments, slug: payments}
      responses:
        '201':
          description: The new workspace.
          headers:
            Location: {$ref: '#/components/headers/Location'}
            ETag: {$ref: '#/components/headers/ETag'}
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Workspace'}
              example:
                id: ws_01j9z3kq4m8r2t6v0x5w7y9a1b
                name: Payments
                slug: payments
                role: owner
                createdAt: '2026-10-16T12:00:00Z'
                updatedAt: '2026-10-16T12:00:00Z'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        default: {$ref: '#/components/responses/Error'}

  /api/v1/workspaces/{workspaceId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      operationId: getWorkspace
      summary: Get a workspace
      description: Returns one workspace.
      tags: [Workspaces]
      responses:
        '200':
          description: The workspace.
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Workspace'}
              example:
                id: ws_01j9z3kq4m8r2t6v0x5w7y9a1b
                name: Payments
                slug: payments
                role: owner
                createdAt: '2026-10-16T12:00:00Z'
                updatedAt: '2026-10-16T12:00:00Z'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      operationId: updateWorkspace
      summary: Update a workspace
      description: Changes the fields that are sent and leaves the others as they are.
      tags: [Workspaces]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        description: The workspace fields to change, as a JSON Merge Patch (RFC 7396).
        content:
          application/merge-patch+json:
            schema: {$ref: '#/components/schemas/WorkspaceUpdate'}
            example: {name: Payments platform}
      responses:
        '200':
          description: The updated workspace.
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Workspace'}
              example:
                id: ws_01j9z3kq4m8r2t6v0x5w7y9a1b
                name: Payments platform
                slug: payments
                role: owner
                createdAt: '2026-10-16T12:00:00Z'
                updatedAt: '2026-10-17T09:30:00Z'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteWorkspace
      summary: Delete a workspace
      description: Deletes the workspace with all its projects. Only owners can do this.
      tags: [Workspaces]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: The workspace is deleted.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        default: {$ref: '#/components/responses/Error'}

  /api/v1/workspaces/{workspaceId}/projects:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      operationId: listProjects
      summary: List a workspace's projects
      description: Lists the projects in a workspace, oldest first.
      tags: [Projects]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
