      type: object
      description: An RFC 9457 problem details object. Every error response uses it.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          description: Identifies the kind of problem. `about:blank` means the HTTP status says it all.
          examples: [about:blank]
        title:
          type: string
          description: A short summary of the kind of problem.
          examples: [Not Found]
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: The HTTP status code.
          examples: [404]
        detail:
          type: string
          description: What went wrong in this case, and how to fix it.
          examples: [There is no project with this ID.]
        instance:
          type: string
          format: uri-reference
          description: The path of the request that failed.
          examples: [/api/v1/projects/prj_01j9z3m2p4r6t8v0x2z4b6d8f0]
        code:
          type: string
          description: A stable, machine-readable identifier for the problem.
          examples: [not-found]
        requestId:
          type: string
          description: Matches the `X-Request-Id` header and the server logs.
          examples: [9f8e7d6c5b4a39281706f5e4]
        errors:
          type: array
          description: The fields that failed validation.
          maxItems: 100
          items: {$ref: '#/components/schemas/FieldError'}
          examples:
            - - pointer: /slug
                detail: Use lowercase letters, digits and single hyphens.
                code: pattern
    FieldError:
      type: object
      description: One invalid field in a request body.
      required: [pointer, detail]
      properties:
        pointer:
          type: string
          description: A JSON Pointer (RFC 6901) to the field in the request body.
          examples: [/slug]
        detail:
          type: string
          description: What is wrong with the field.
          examples: [Use lowercase letters, digits and single hyphens.]
        code:
          type: string
          description: The rule that failed.
          examples: [pattern]

    Meta:
      type: object
      description: Details of the installation.
      required: [product, version, apiVersion, roles]
      properties:
        product:
          type: string
          description: The product name.
          examples: [Signalbox]
        version:
          type: string
          description: The server version.
          examples: [0.1.0]
        commit:
          type: string
          description: The source commit the server was built from.
          examples: [1a2b3c4d5e6f]
        buildDate:
          type: string
          description: When the server was built.
          examples: ['2026-10-16T12:00:00Z']
        apiVersion:
          type: string
          description: The API's major version.
          examples: [v1]
        roles:
          type: array
          description: The roles this process runs.
          maxItems: 6
          uniqueItems: true
          items: {$ref: '#/components/schemas/Role'}
          examples: [[api, mock]]
    Role:
      type: string
      description: A role of `signalbox-server`.
      enum: [api, mock, runner, scheduler, worker, ingest]
      examples: [api]

    HealthResponse:
      type: object
      description: A health document in the Health Check Response Format for HTTP APIs.
      required: [status]
      properties:
        status: {$ref: '#/components/schemas/HealthStatus'}
        version:
          type: string
          description: The version of the health format.
          examples: ['1']
        releaseId:
          type: string
          description: The server release.
          examples: [0.1.0]
        serviceId:
          type: string
          description: The service that answered.
          examples: [signalbox-server]
        output:
          type: string
          description: Why the status isn't `pass`.
          examples: [shutting down]
        checks:
          type: object
          description: Results per component, keyed by `component:measurement`.
          additionalProperties:
            type: array
            maxItems: 50
            items: {$ref: '#/components/schemas/HealthCheckResult'}
          examples:
            - uptime:
                - componentType: system
                  observedValue: 3600
                  observedUnit: s
                  status: pass
                  time: '2026-10-16T12:00:00Z'
    HealthStatus:
      type: string
      description: '`pass` is healthy, `warn` is healthy with concerns, `fail` is unhealthy.'
      enum: [pass, warn, fail]
      examples: [pass]
    HealthCheckResult:
      type: object
      description: The result of one check.
      required: [status, time]
      properties:
        componentType:
          type: string
          description: The kind of component checked.
          examples: [datastore]
        observedValue:
          type: [number, string, boolean]
          description: The measured value.
          examples: [12]
        observedUnit:
          type: string
          description: The unit of the measured value.
          examples: [ms]
        status: {$ref: '#/components/schemas/HealthStatus'}
        time: {$ref: '#/components/schemas/Timestamp'}
        output:
          type: string
          description: Why the check isn't passing.
          examples: [no answer within 2s]

    Report:
      type: object
      description: The result of validating and linting one document.
      required: [diagnostics, counts]
      properties:
        format: {$ref: '#/components/schemas/SpecFormat'}
        version:
          type: string
          description: The version the document declares. Missing when the document couldn't be read.
          examples: [3.1.0]
        info:
          type: object
          description: What the document's `info` object says. Missing when the document couldn't be read.
          required: [title, version]
          properties:
            title: {type: string, description: '`info.title`.', examples: [Orders API]}
            version: {type: string, description: '`info.version`, the version of the API.', examples: [1.1.0]}
        diagnostics:
          type: array
          description: Every problem found, ordered by position.
          maxItems: 100000
          items: {$ref: '#/components/schemas/Diagnostic'}
          examples:
            - - severity: warning
                source: linter
                code: operation-operationId
                message: The `GET` operation does not contain an `operationId`.
                path: "$.paths['/things'].get"
                range: {start: {line: 7, column: 5}, end: {line: 7, column: 5}}
        counts: {$ref: '#/components/schemas/Counts'}
    SpecFormat:
      type: string
      description: The specification family and minor version.
      enum: [swagger-2.0, openapi-3.0, openapi-3.1, openapi-3.2]
      examples: [openapi-3.1]
    Diagnostic:
      type: object
      description: One problem found in a document.
      required: [severity, source, code, message, range]
      properties:
        severity:
          type: string
          description: How serious the problem is. Errors mean the document is invalid.
          enum: [error, warning, info, hint]
          examples: [error]
        source:
          type: string
          description: The check that found the problem.
          enum: [parser, validator, resolver, linter]
          examples: [resolver]
        code:
          type: string
          description: The kind of problem, or the lint rule ID.
          examples: [unresolved-reference]
        message:
          type: string
          description: What is wrong.
          examples: [Component `#/components/schemas/Missing` does not exist in the specification.]
        path:
          type: string
          description: Where the problem is, as a JSON Pointer or JSONPath.
          examples: ["$.paths['/things'].get"]
        range: {$ref: '#/components/schemas/Range'}
        howToFix:
          type: string
          description: A suggestion for fixing the problem.
          examples: [Check that the referenced component exists and that the $ref is spelled correctly.]
    Range:
      type: object
      description: Where a problem starts and ends in the document.
      required: [start, end]
      properties:
        start: {$ref: '#/components/schemas/Position'}
        end: {$ref: '#/components/schemas/Position'}
    Position:
      type: object
      description: A 1-based line and column. Zero means the position is unknown.
      required: [line, column]
      properties:
        line:
          type: integer
          minimum: 0
          description: The line, starting at 1.
          examples: [14]
        column:
          type: integer
          minimum: 0
          description: The column, starting at 1.
          examples: [17]
    Counts:
      type: object
      description: How many problems there are of each severity.
      required: [errors, warnings, infos, hints]
      properties:
        errors: {type: integer, minimum: 0, description: Problems that make the document invalid., examples: [1]}
        warnings: {type: integer, minimum: 0, description: Quality or security issues., examples: [3]}
        infos: {type: integer, minimum: 0, description: Information worth knowing., examples: [0]}
        hints: {type: integer, minimum: 0, description: Suggestions., examples: [1]}

    User:
      type: object
      description: A person with an account.
      required: [id, email, name]
      properties:
        id: {$ref: '#/components/schemas/UserId'}
        email:
          type: string
          format: email
          description: The user's email address.
          examples: [ada@example.com]
        name: {$ref: '#/components/schemas/Name'}
    SessionCreate:
      type: object
      description: Credentials to sign in with.
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: The account's email address.
          examples: [ada@example.com]
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 1024
          writeOnly: true
          description: The account's password.
          examples: [correct horse battery staple]
    Session:
      type: object
      description: A signed-in session.
      required: [user, expiresAt, csrfToken]
      properties:
        user: {$ref: '#/components/schemas/User'}
        expiresAt: {$ref: '#/components/schemas/Timestamp'}
        csrfToken:
          type: string
          description: Send this in the `X-CSRF-Token` header on unsafe requests.
          examples: [3q2+7wAAAAAAAAAAAAAAAA]
        mfaRequired:
          type: boolean
          description: True when the account must confirm a second factor before the session is usable.
          examples: [false]
    SignInOptions:
      type: object
      description: The ways to sign in besides an email address and password.
      properties:
        sso:
          type: object
          description: Single sign-on through an OpenID Connect identity provider. Missing when it isn't set up.
          required: [name]
          properties:
            name:
              type: string
              description: The provider's name, for the sign-in button.
              examples: [Okta]
          examples:
            - {name: Okta}
    SetupStatus:
      type: object
      description: Whether the installation still needs its first account.
      required: [required]
      properties:
        required:
          type: boolean
          description: True until someone completes first-run setup.
          examples: [true]
    SetupCreate:
      type: object
      description: The setup code and the details of the first admin account.
      required: [setupCode, name, email, password]
      additionalProperties: false
      properties:
        setupCode:
          type: string
          minLength: 1
          maxLength: 128
          description: The code from the server log or from `SIGNALBOX_SETUP_CODE`. Case, spaces and hyphens don't matter.
          examples: [K7QM-2XWP-9D4H-TR6B]
        name: {$ref: '#/components/schemas/Name'}
        email:
          type: string
          format: email
          maxLength: 254
          description: The admin's email address, used to sign in.
          examples: [ada@example.com]
        password: {$ref: '#/components/schemas/NewPassword'}
    NewPassword:
      type: string
      format: password
      minLength: 12
      maxLength: 1024
      writeOnly: true
      description: A new password of at least 12 characters. A few unrelated words make a strong one.
      examples: [correct horse battery staple]

    Workspace:
      type: object
      description: A workspace groups the projects, members and rules of one team or organization unit.
      required: [id, name, slug, role, createdAt, updatedAt]
      properties:
        id: {$ref: '#/components/schemas/WorkspaceId'}
        name: {$ref: '#/components/schemas/Name'}
        slug: {$ref: '#/components/schemas/Slug'}
        role: {$ref: '#/components/schemas/WorkspaceRole'}
        createdAt: {$ref: '#/components/schemas/Timestamp'}
        updatedAt: {$ref: '#/components/schemas/Timestamp'}
    WorkspaceRole:
      type: string
      description: |
        The caller's role in the workspace:

        - `owner` can do everything, including deleting the workspace.
        - `admin` can change the workspace and manage its projects.
        - `editor` can create and change projects.
        - `viewer` can read everything in the workspace.
      enum: [owner, admin, editor, viewer]
      examples: [owner]
    WorkspaceCreate:
      type: object
      description: A new workspace.
      required: [name, slug]
      additionalProperties: false
      properties:
        name: {$ref: '#/components/schemas/Name'}
        slug: {$ref: '#/components/schemas/Slug'}
    WorkspaceUpdate:
      type: object
      description: Changes to a workspace. Fields that aren't sent keep their value.
      minProperties: 1
      additionalProperties: false
      properties:
        name: {$ref: '#/components/schemas/Name'}
        slug: {$ref: '#/components/schemas/Slug'}
    WorkspacePage:
      type: object
      description: One page of the workspace list, with a cursor for the next page.
      required: [data]
      properties:
        data:
          type: array
          description: The workspaces on this page.
          maxItems: 200
          items: {$ref: '#/components/schemas/Workspace'}
          examples:
            - - {id: ws_01j9z3kq4m8r2t6v0x5w7y9a1b, name: Payments, slug: payments, role: owner, createdAt: '2026-10-16T12:00:00Z', updatedAt: '2026-10-16T12:00:00Z'}
        nextCursor: {$ref: '#/components/schemas/NextCursor'}
    NextCursor:
      type: string
      description: Pass this as `cursor` to get the next page. Missing on the last page.
      maxLength: 512
      examples: [eyJpZCI6IndzXzAxajl6M2txNG04cjJ0NnYweDV3N3k5YTFiIn0]
    WorkspaceSummary:
      type: object
      description: A workspace's ID and name, for someone who isn't a member yet.
      required: [id, name]
      properties:
        id: {$ref: '#/components/schemas/WorkspaceId'}
        name: {$ref: '#/components/schemas/Name'}

    Member:
      type: object
      description: A person in a workspace, with their role.
      required: [user, role, joinedAt]
      properties:
        user: {$ref: '#/components/schemas/User'}
        role: {$ref: '#/components/schemas/WorkspaceRole'}
        joinedAt: {$ref: '#/components/schemas/Timestamp'}
    MemberUpdate:
      type: object
      description: A member's new role.
      required: [role]
      additionalProperties: false
      properties:
        role: {$ref: '#/components/schemas/WorkspaceRole'}
    MemberPage:
      type: object
      description: One page of a workspace's members, with a cursor for the next page.
      required: [data]
      properties:
        data:
          type: array
          description: The members on this page.
          maxItems: 200
          items: {$ref: '#/components/schemas/Member'}
          examples:
            - - {user: {id: usr_01j9z3kq4m8r2t6v0x5w7y9a1b, email: ada@example.com, name: Ada Lovelace}, role: owner, joinedAt: '2026-10-16T12:00:00Z'}
        nextCursor: {$ref: '#/components/schemas/NextCursor'}

    Invitation:
      type: object
      description: An open invitation to join a workspace. `invitedBy` is missing when the inviter's account was deleted.
      required: [id, workspaceId, email, role, createdAt, expiresAt]
      properties:
        id: {$ref: '#/components/schemas/InvitationId'}
        workspaceId: {$ref: '#/components/schemas/WorkspaceId'}
        email:
          type: string
          format: email
          description: The only email address that can accept the invitation.
          examples: [grace@example.com]
        role: {$ref: '#/components/schemas/WorkspaceRole'}
        invitedBy: {$ref: '#/components/schemas/UserId'}
        createdAt: {$ref: '#/components/schemas/Timestamp'}
        expiresAt: {$ref: '#/components/schemas/Timestamp'}
    NewInvitation:
      description: An invitation that was just created, with its link. The link can't be retrieved again.
      allOf:
        - $ref: '#/components/schemas/Invitation'
        - type: object
          required: [url]
          properties:
            url:
              type: string
              format: uri
              description: The link to send. The token after `#` stays in the browser and never reaches the server's logs.
              examples: ['https://signalbox.example.com/invite#Zk9vX2JhcjEyMzQ1Njc4OTBhYmNkZWZnaGlqa2xtbm8']
    InvitationCreate:
      type: object
      description: Who to invite, and with which role.
      required: [email, role]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: The email address of the person to invite.
          examples: [grace@example.com]
        role: {$ref: '#/components/schemas/WorkspaceRole'}
    InvitationPage:
      type: object
      description: One page of open invitations, with a cursor for the next page.
      required: [data]
      properties:
        data:
          type: array
          description: The invitations on this page.
          maxItems: 200
          items: {$ref: '#/components/schemas/Invitation'}
          examples:
            - - {id: inv_01j9z3v2x4z6b8d0f2h4k6m8p0, workspaceId: ws_01j9z3kq4m8r2t6v0x5w7y9a1b, email: grace@example.com, role: editor, createdAt: '2026-10-16T12:00:00Z', expiresAt: '2026-10-23T12:00:00Z'}
        nextCursor: {$ref: '#/components/schemas/NextCursor'}
    InvitationToken:
      type: object
      description: The token from an invitation link, the part after `#`.
      required: [token]
      additionalProperties: false
      properties:
        token:
          type: string
          maxLength: 128
          description: The invitation token.
          examples: [Zk9vX2JhcjEyMzQ1Njc4OTBhYmNkZWZnaGlqa2xtbm8]
    InvitationDetails:
      type: object
      description: What an invitation link offers.
      required: [workspace, email, role, expiresAt, accountExists]
      properties:
        workspace: {$ref: '#/components/schemas/WorkspaceSummary'}
        email:
          type: string
          format: email
          description: The email address the invitation was sent to.
          examples: [grace@example.com]
        role: {$ref: '#/components/schemas/WorkspaceRole'}
        invitedBy:
          type: string
          description: The name of the person who sent the invitation. Missing when that account was deleted.
          examples: [Ada Lovelace]
        expiresAt: {$ref: '#/components/schemas/Timestamp'}
        accountExists:
          type: boolean
          description: Whether an account with the email address exists. If it does, sign in and accept; if not, sign up with the invitation.
          examples: [false]
    InvitationSignUp:
      type: object
      description: The invitation token and the new account's details.
      required: [token, name, password]
      additionalProperties: false
      properties:
        token:
          type: string
          maxLength: 128
          description: The token from the invitation link the person received.
          examples: [Zk9vX2JhcjEyMzQ1Njc4OTBhYmNkZWZnaGlqa2xtbm8]
        name: {$ref: '#/components/schemas/Name'}
        password: {$ref: '#/components/schemas/NewPassword'}

    Project:
      type: object
      description: A project is one system, such as a product or a platform, with its own canvas, environments and services.
      required: [id, workspaceId, name, createdAt, updatedAt]
      properties:
        id: {$ref: '#/components/schemas/ProjectId'}
        workspaceId: {$ref: '#/components/schemas/WorkspaceId'}
        name: {$ref: '#/components/schemas/Name'}
        description: {$ref: '#/components/schemas/Description'}
        createdAt: {$ref: '#/components/schemas/Timestamp'}
        updatedAt: {$ref: '#/components/schemas/Timestamp'}
    ProjectCreate:
      type: object
      description: A new project.
      required: [name]
      additionalProperties: false
      properties:
        name: {$ref: '#/components/schemas/Name'}
        description: {$ref: '#/components/schemas/Description'}
    ProjectUpdate:
      type: object
      description: Changes to a project. Fields that aren't sent keep their value.
      minProperties: 1
      additionalProperties: false
      properties:
        name: {$ref: '#/components/schemas/Name'}
        description:
          description: The new description. Send `null` or an empty string to remove it.
          examples: ['Checkout, orders, payments and refunds.']
          anyOf:
            - {$ref: '#/components/schemas/Description'}
            - {type: 'null'}
    ProjectPage:
      type: object
      description: One page of the project list, with a cursor for the next page.
      required: [data]
      properties:
        data:
          type: array
          description: The projects on this page.
          maxItems: 200
          items: {$ref: '#/components/schemas/Project'}
          examples:
            - - {id: prj_01j9z3m2p4r6t8v0x2z4b6d8f0, workspaceId: ws_01j9z3kq4m8r2t6v0x5w7y9a1b, name: Shop, createdAt: '2026-10-16T12:00:00Z', updatedAt: '2026-10-16T12:00:00Z'}
        nextCursor: {$ref: '#/components/schemas/NextCursor'}

    Environment:
      type: object
      description: An environment of a project, with its own base URLs, variables and secrets.
      required: [id, projectId, name, slug, kind, position, createdAt, updatedAt]
      properties:
        id: {$ref: '#/components/schemas/EnvironmentId'}
        projectId: {$ref: '#/components/schemas/ProjectId'}
        name: {$ref: '#/components/schemas/Name'}
        slug: {$ref: '#/components/schemas/Slug'}
        kind: {$ref: '#/components/schemas/EnvironmentKind'}
        position:
          type: integer
          minimum: 0
          description: The environment's place in the environment switcher, starting at 0.
          examples: [2]
        createdAt: {$ref: '#/components/schemas/Timestamp'}
        updatedAt: {$ref: '#/components/schemas/Timestamp'}
    EnvironmentKind:
      type: string
      description: What the environment is for. Production environments get extra confirmation before destructive actions.
      enum: [development, staging, production, other]
      examples: [production]
    EnvironmentCreate:
      type: object
      description: A new environment.
      required: [name, slug, kind]
      additionalProperties: false
      properties:
        name: {$ref: '#/components/schemas/Name'}
        slug: {$ref: '#/components/schemas/Slug'}
        kind: {$ref: '#/components/schemas/EnvironmentKind'}
    EnvironmentUpdate:
      type: object
      description: Changes to an environment. Fields that aren't sent keep their value.
      minProperties: 1
      additionalProperties: false
      properties:
        name: {$ref: '#/components/schemas/Name'}
        slug: {$ref: '#/components/schemas/Slug'}
        kind: {$ref: '#/components/schemas/EnvironmentKind'}
        position:
          type: integer
          minimum: 0
          description: The new place in the environment switcher.
          examples: [0]
    EnvironmentVariable:
      type: object
      description: One of an environment's variables. A secret has no `value` when it is read.
      required: [key, secret]
      properties:
        key: {$ref: '#/components/schemas/VariableKey'}
        value: {type: string, maxLength: 65536, description: The value., examples: ['https://api.example.com']}
        secret: {type: boolean, description: 'Whether the value is a secret: encrypted at rest, never returned, and masked in history.', examples: [false]}
    VariableKey:
      type: string
      description: 'A variable''s name, as `{{name}}` uses it: no spaces or braces, and not starting with `$`.'
      minLength: 1
      maxLength: 200
      pattern: '^[^${}\s][^{}\s]*$'
      examples: [baseUrl]
    EnvironmentVariables:
      type: object
      description: An environment's variables, in order.
      required: [environmentId, variables]
      properties:
        environmentId: {$ref: '#/components/schemas/EnvironmentId'}
        variables:
          type: array
          description: The variables, in order.
          maxItems: 500
          items: {$ref: '#/components/schemas/EnvironmentVariable'}
          examples: [[{key: baseUrl, value: 'https://api.example.com', secret: false}, {key: apiKey, secret: true}]]
        updatedAt: {$ref: '#/components/schemas/Timestamp'}
    EnvironmentVariablesPut:
      type: object
      description: Every variable an environment keeps.
      required: [variables]
      additionalProperties: false
      properties:
        variables:
          type: array
          description: The variables, in order, each name once. A secret without `value` keeps the value it has.
          maxItems: 500
          items:
            type: object
            description: A variable to keep.
            required: [key]
            additionalProperties: false
            properties:
              key: {$ref: '#/components/schemas/VariableKey'}
              value: {type: string, maxLength: 65536, description: The value; for a secret, its new value., examples: ['https://api.example.com']}
              secret: {type: boolean, default: false, description: Whether the value is a secret., examples: [false]}
          examples: [[{key: baseUrl, value: 'https://api.example.com'}, {key: apiKey, value: sk_live_123, secret: true}]]
    EnvironmentPage:
      type: object
      description: One page of the environment list, with a cursor for the next page.
      required: [data]
      properties:
        data:
          type: array
          description: The environments on this page.
          maxItems: 200
          items: {$ref: '#/components/schemas/Environment'}
          examples:
            - - {id: env_01j9z3n5q7s9v1w3y5a7c9e1g3, projectId: prj_01j9z3m2p4r6t8v0x2z4b6d8f0, name: Production, slug: production, kind: production, position: 2, createdAt: '2026-10-16T12:00:00Z', updatedAt: '2026-10-16T12:00:00Z'}
        nextCursor: {$ref: '#/components/schemas/NextCursor'}

    Service:
      type: object
      description: A service on a project's canvas.
      required: [id, projectId, name, slug, position, createdAt, updatedAt]
      properties:
        id: {$ref: '#/components/schemas/ServiceId'}
        projectId: {$ref: '#/components/schemas/ProjectId'}
        name: {$ref: '#/components/schemas/Name'}
        slug: {$ref: '#/components/schemas/Slug'}
        description: {$ref: '#/components/schemas/Description'}
        telemetryServiceName: {$ref: '#/components/schemas/TelemetryServiceName'}
        position: {$ref: '#/components/schemas/CanvasPosition'}
        createdAt: {$ref: '#/components/schemas/Timestamp'}
        updatedAt: {$ref: '#/components/schemas/Timestamp'}
    CanvasPosition:
      type: object
      description: Where the node sits on the canvas, in canvas units.
      required: [x, y]
      properties:
        x: {type: number, description: Horizontal position., examples: [320]}
        y: {type: number, description: Vertical position., examples: [120]}
    CanvasPlacements:
      type: object
      description: Services to move on a canvas.
      required: [positions]
      additionalProperties: false
      properties:
        positions:
          type: array
          description: Where each service's node goes. Each service may appear once.
          minItems: 1
          maxItems: 500
          items: {$ref: '#/components/schemas/CanvasPlacement'}
          examples: [[{serviceId: svc_01j9z3q1s3v5w7y9a1c3e5g7j9, x: 320, y: 120}]]
    CanvasPlacement:
      type: object
      description: Where one service's node goes, in canvas units.
      required: [serviceId, x, y]
      additionalProperties: false
      properties:
        serviceId: {$ref: '#/components/schemas/ServiceId'}
        x: {type: number, minimum: -1000000000, maximum: 1000000000, description: The node's horizontal position., examples: [320]}
        y: {type: number, minimum: -1000000000, maximum: 1000000000, description: The node's vertical position., examples: [120]}
    TelemetryServiceName:
      type: string
      maxLength: 255
      description: The `service.name` a service reports in its traces. It links the service's spans to its node on the canvas.
      examples: [orders-api]
    ServiceCreate:
      type: object
      description: A new service.
      required: [name, slug]
      additionalProperties: false
      properties:
        name: {$ref: '#/components/schemas/Name'}
        slug: {$ref: '#/components/schemas/Slug'}
        description: {$ref: '#/components/schemas/Description'}
        telemetryServiceName: {$ref: '#/components/schemas/TelemetryServiceName'}
        position:
          $ref: '#/components/schemas/CanvasPosition'
          type: object
          description: Where the node goes. Without it, the service takes the next free spot of a grid four nodes wide, after the project's other services.
          examples: [{x: 320, y: 120}]
    ServiceUpdate:
      type: object
      description: Changes to a service. Fields that aren't sent keep their value.
      minProperties: 1
      additionalProperties: false
      properties:
        name: {$ref: '#/components/schemas/Name'}
        slug: {$ref: '#/components/schemas/Slug'}
        description: {$ref: '#/components/schemas/Description'}
        telemetryServiceName: {$ref: '#/components/schemas/TelemetryServiceName'}
        position: {$ref: '#/components/schemas/CanvasPosition'}
    ServicePage:
      type: object
      description: One page of the service list, with a cursor for the next page.
      required: [data]
      properties:
        data:
          type: array
          description: The services on this page.
          maxItems: 200
          items: {$ref: '#/components/schemas/Service'}
          examples:
            - - {id: svc_01j9z3q1s3v5w7y9a1c3e5g7j9, projectId: prj_01j9z3m2p4r6t8v0x2z4b6d8f0, name: orders-api, slug: orders-api, position: {x: 320, y: 120}, createdAt: '2026-10-16T12:00:00Z', updatedAt: '2026-10-16T12:00:00Z'}
        nextCursor: {$ref: '#/components/schemas/NextCursor'}

    Spec:
      type: object
      description: An OpenAPI document of a service. Its content lives in revisions.
      required: [id, serviceId, name, createdAt, updatedAt]
      properties:
        id: {$ref: '#/components/schemas/SpecId'}
        serviceId: {$ref: '#/components/schemas/ServiceId'}
        name: {$ref: '#/components/schemas/Name'}
        currentRevisionId: {$ref: '#/components/schemas/RevisionId'}
        createdAt: {$ref: '#/components/schemas/Timestamp'}
        updatedAt: {$ref: '#/components/schemas/Timestamp'}
    SpecCreate:
      type: object
      description: A new spec and the content of its first revision.
      required: [name, content]
      additionalProperties: false
      properties:
        name: {$ref: '#/components/schemas/Name'}
        content: {$ref: '#/components/schemas/SpecContent'}
    SpecUpdate:
      type: object
      description: Changes to a spec. Fields that aren't sent keep their value.
      minProperties: 1
      additionalProperties: false
      properties:
        name: {$ref: '#/components/schemas/Name'}
    SpecContent:
      type: string
      description: The full OpenAPI document as YAML or JSON text.
      minLength: 1
      maxLength: 10485760
      examples: ["openapi: 3.1.1\ninfo:\n  title: Orders API\n  version: 1.0.0\npaths: {}\n"]
    SpecPage:
      type: object
      description: One page of the spec list, with a cursor for the next page.
      required: [data]
      properties:
        data:
          type: array
          description: The specs on this page.
          maxItems: 200
          items: {$ref: '#/components/schemas/Spec'}
          examples:
            - - {id: spec_01j9z3r4t6v8x0z2b4d6f8h0k2, serviceId: svc_01j9z3q1s3v5w7y9a1c3e5g7j9, name: Orders API, createdAt: '2026-10-16T12:00:00Z', updatedAt: '2026-10-16T12:00:00Z'}
        nextCursor: {$ref: '#/components/schemas/NextCursor'}

    Revision:
      type: object
      description: One saved version of a spec's document. Revisions never change.
      required: [id, specId, number, format, version, sizeBytes, sha256, counts, createdBy, createdAt]
      properties:
        id: {$ref: '#/components/schemas/RevisionId'}
        specId: {$ref: '#/components/schemas/SpecId'}
        number:
          type: integer
          minimum: 1
          description: The revision's sequence number within the spec, starting at 1.
          examples: [3]
        message:
          type: string
          maxLength: 500
          description: What changed, in the author's words.
          examples: [Add refunds]
        format: {$ref: '#/components/schemas/SpecFormat'}
        version:
          type: string
          description: The OpenAPI version the document declares.
          examples: [3.1.1]
        title:
          type: string
          maxLength: 1000
          description: The document's `info.title`.
          examples: [Orders API]
        apiVersion:
          type: string
          maxLength: 1000
          description: The document's `info.version`, the version of the API it describes.
          examples: [1.1.0]
        sizeBytes:
          type: integer
          minimum: 0
          description: The size of the document in bytes.
          examples: [18342]
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: The SHA-256 hash of the document.
          examples: [9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08]
        counts: {$ref: '#/components/schemas/Counts'}
        createdBy: {$ref: '#/components/schemas/UserId'}
        createdAt: {$ref: '#/components/schemas/Timestamp'}
    RevisionCreate:
      type: object
      description: The content of a new revision.
      required: [content]
      additionalProperties: false
      properties:
        content: {$ref: '#/components/schemas/SpecContent'}
        message:
          type: string
          maxLength: 500
          description: A short note on what changed, shown in the revision history.
          examples: [Add refunds]
    Version:
      type: object
      description: A published revision of a spec, under a name. Versions never change.
      required: [id, specId, name, revisionId, revisionNumber, publishedBy, publishedAt]
      properties:
        id: {$ref: '#/components/schemas/VersionId'}
        specId: {$ref: '#/components/schemas/SpecId'}
        name: {$ref: '#/components/schemas/VersionName'}
        revisionId: {$ref: '#/components/schemas/RevisionId'}
        revisionNumber:
          type: integer
          minimum: 1
          description: The published revision's number.
          examples: [7]
        apiVersion:
          type: string
          maxLength: 1000
          description: The published document's `info.version`.
          examples: [1.4.0]
        notes:
          type: string
          maxLength: 2000
          description: Release notes.
          examples: [Adds refunds.]
        publishedBy: {$ref: '#/components/schemas/UserId'}
        publishedAt: {$ref: '#/components/schemas/Timestamp'}
    VersionName:
      type: string
      description: A version's name, unique in its spec.
      minLength: 1
      maxLength: 64
      pattern: '^[0-9A-Za-z][0-9A-Za-z.+_-]*$'
      examples: [1.4.0]
    VersionCreate:
      type: object
      description: What to publish.
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/VersionName'
          type: string
          description: Defaults to the revision's `info.version`.
          examples: [1.4.0]
        revisionId:
          $ref: '#/components/schemas/RevisionId'
          type: string
          description: Defaults to the spec's current revision.
          examples: [rev_01j9z3s7v9x1z3b5d7f9h1k3m5]
        notes:
          type: string
          maxLength: 2000
          description: Release notes to publish with the version.
          examples: [Adds refunds.]
    VersionPage:
      type: object
      description: One page of a spec's versions, with a cursor for the next page.
      required: [data]
      properties:
        data:
          type: array
          description: The versions on this page, newest first.
          maxItems: 200
          items: {$ref: '#/components/schemas/Version'}
          examples:
            - - id: ver_01j9z3v2x4z6b8d0f2h4k6m8p0
                specId: spec_01j9z3r4t6v8x0z2b4d6f8h0k2
                name: 1.4.0
                revisionId: rev_01j9z3s7v9x1z3b5d7f9h1k3m5
                revisionNumber: 7
                publishedBy: usr_01j9z3kq4m8r2t6v0x5w7y9a1b
                publishedAt: '2026-10-17T12:00:00Z'
        nextCursor: {$ref: '#/components/schemas/NextCursor'}
    RevisionPage:
      type: object
      description: One page of the revision history, with a cursor for the next page.
      required: [data]
      properties:
        data:
          type: array
          description: The revisions on this page.
          maxItems: 200
          items: {$ref: '#/components/schemas/Revision'}
          examples:
            - - {id: rev_01j9z3s7v9x1z3b5d7f9h1k3m5, specId: spec_01j9z3r4t6v8x0z2b4d6f8h0k2, number: 2, format: openapi-3.1, version: 3.1.1, sizeBytes: 18342, sha256: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08, counts: {errors: 0, warnings: 3, infos: 0, hints: 1}, createdBy: usr_01j9z3kq4m8r2t6v0x5w7y9a1b, createdAt: '2026-10-16T12:00:00Z'}
        nextCursor: {$ref: '#/components/schemas/NextCursor'}
    Reference:
      type: object
      description: An API's reference documentation, built from a published version.
      required: [title, version, groups]
      properties:
        title: {type: string, description: The API's name, from `info.title`., examples: [Orders API]}
        version: {type: string, description: The document's `info.version`., examples: [1.4.0]}
        summary: {type: string, description: The document's `info.summary`., examples: [Orders and refunds.]}
        description: {type: string, description: 'The document''s `info.description`, in CommonMark.', examples: ['Orders and **refunds**.']}
        servers:
          type: array
          description: The API's base URLs.
          items: {$ref: '#/components/schemas/ReferenceServer'}
          examples: [[{url: 'https://orders.example.com/v1'}]]
        groups:
          type: array
          description: Operations by tag, in the document's tag order. Operations without a tag come last, in a group with no name.
          items: {$ref: '#/components/schemas/ReferenceGroup'}
          examples: [[{name: orders, operations: []}]]
        schemas:
          type: array
          description: The document's component schemas.
          items: {$ref: '#/components/schemas/ReferenceNamedSchema'}
          examples: [[{name: Order, schema: {types: [object]}}]]
        securitySchemes:
          type: array
          description: The ways to authorize calls.
          items: {$ref: '#/components/schemas/ReferenceSecurityScheme'}
          examples: [[{name: bearer, type: http, scheme: bearer}]]
    ReferenceServer:
      type: object
      description: A base URL, with its variables set to their defaults.
      required: [url]
      properties:
        url: {type: string, description: The URL. It may be relative to the document., examples: ['https://orders.example.com/v1']}
        description: {type: string, description: What the server is for., examples: [Production]}
    ReferenceGroup:
      type: object
      description: A tag and its operations. An operation with several tags is in each of their groups.
      required: [name, operations]
      properties:
        name: {type: string, description: 'The tag''s name; empty for operations without a tag.', examples: [orders]}
        summary: {type: string, description: The tag's summary (OpenAPI 3.2)., examples: [Orders]}
        description: {type: string, description: 'The tag''s description, in CommonMark.', examples: [Everything about orders.]}
        parent: {type: string, description: The group this one is nested in (OpenAPI 3.2)., examples: [shop]}
        operations:
          type: array
          description: The group's operations, in document order.
          items: {$ref: '#/components/schemas/ReferenceOperation'}
    ReferenceOperation:
      type: object
      description: One method on one path.
      required: [id, method, path, responses]
      properties:
        id: {type: string, description: 'Identifies the operation within the reference: its operationId, or its method and path.', examples: [getOrder]}
        operationId: {type: string, description: The document's operationId., examples: [getOrder]}
        method: {type: string, description: 'The HTTP method, in capitals.', examples: [GET]}
        path: {type: string, description: The path template., examples: ['/orders/{id}']}
        summary: {type: string, description: The operation's summary., examples: [Get an order]}
        description: {type: string, description: 'The operation''s description, in CommonMark.', examples: [Returns one order.]}
        deprecated: {type: boolean, description: Whether the operation is deprecated., examples: [false]}
        servers:
          type: array
          description: Base URLs that replace the document's for this operation.
          items: {$ref: '#/components/schemas/ReferenceServer'}
        parameters:
          type: array
          description: 'Path, query, header and cookie parameters, the path item''s first.'
          items: {$ref: '#/components/schemas/ReferenceParameter'}
        requestBody: {$ref: '#/components/schemas/ReferenceRequestBody'}
        responses:
          type: array
          description: 'Responses by status code, lowest first, then ranges such as 4XX, then default.'
          items: {$ref: '#/components/schemas/ReferenceResponse'}
        security:
          type: array
          description: The ways to authorize a call; any one is enough. An empty way means calls may be anonymous. Absent when no authorization is needed.
          items:
            type: array
            description: Security schemes that must all be used.
            items: {$ref: '#/components/schemas/ReferenceSecurityUse'}
    ReferenceParameter:
      type: object
      description: A parameter, or a response header.
      required: [name, in]
      properties:
        name: {type: string, description: The parameter's name., examples: [id]}
        in: {type: string, description: Where it goes., examples: [path], enum: [path, query, header, cookie, querystring]}
        description: {type: string, description: 'The parameter''s description, in CommonMark.', examples: [The order's number.]}
        required: {type: boolean, description: Whether it must be sent., examples: [true]}
        deprecated: {type: boolean, description: Whether the parameter is deprecated., examples: [false]}
        schema: {$ref: '#/components/schemas/ReferenceSchema'}
        example: {type: [string, number, boolean, object, array, 'null'], description: An example of the parameter's value., examples: [42]}
    ReferenceRequestBody:
      type: object
      description: What an operation accepts.
      required: [content]
      properties:
        description: {type: string, description: 'The request body''s description, in CommonMark.', examples: [The order to create.]}
        required: {type: boolean, description: Whether a body must be sent., examples: [true]}
        content:
          type: array
          description: The request body in each media type it may have.
          items: {$ref: '#/components/schemas/ReferenceMedia'}
    ReferenceResponse:
      type: object
      description: The response for a status code.
      required: [code]
      properties:
        code: {type: string, description: 'A status code, a range such as 4XX, or default.', examples: ['200']}
        description: {type: string, description: 'The response''s description, in CommonMark.', examples: [The order.]}
        headers:
          type: array
          description: Response headers. Content-Type is left out; the content describes it.
          items: {$ref: '#/components/schemas/ReferenceParameter'}
        content:
          type: array
          description: The response body in each media type it may have.
          items: {$ref: '#/components/schemas/ReferenceMedia'}
    ReferenceMedia:
      type: object
      description: A body in one media type.
      required: [type]
      properties:
        type: {type: string, description: The media type., examples: [application/json]}
        schema: {$ref: '#/components/schemas/ReferenceSchema'}
        examples:
          type: array
          description: 'The document''s named examples, or one built from its example or schema, as the mock sends it.'
          items: {$ref: '#/components/schemas/ReferenceExample'}
    ReferenceExample:
      type: object
      description: 'An example body, as text in its media type.'
      required: [value]
      properties:
        name: {type: string, description: 'The example''s name. `Prefer: example=name` asks the mock for it.', examples: [large]}
        summary: {type: string, description: The example's summary., examples: [A large order]}
        description: {type: string, description: 'The example''s description, in CommonMark.', examples: [More than 100 lines.]}
        value: {type: string, description: The body., examples: ['{"id": 42}']}
    ReferenceSchema:
      type: object
      description: |
        A schema, with references to component schemas resolved in place; `name` says which component it is. A reference that would repeat one already being shown, or nest too deeply, isn't expanded: `ref` is true, and the component is in the reference's `schemas`.
      properties:
        name: {type: string, description: The component schema this is., examples: [Order]}
        ref: {type: boolean, description: Whether this is only a link to the component `name`., examples: [false]}
        types:
          type: array
          description: The JSON types it allows. A null type sets `nullable` instead.
          items: {type: string, description: A JSON type., examples: [object]}
        format: {type: string, description: 'The format, such as date-time.', examples: [date-time]}
        title: {type: string, description: The title., examples: [Order]}
        description: {type: string, description: 'The schema''s description, in CommonMark.', examples: [An order.]}
        constraints:
          type: array
          description: 'Limits on the value, in short phrases.'
          items: {type: string, description: A limit., examples: ['>= 1']}
        enum:
          type: array
          description: The values it allows.
          items: {type: [string, number, boolean, object, array, 'null'], description: An allowed value., examples: [paid]}
        const: {type: [string, number, boolean, object, array, 'null'], description: The one value it allows., examples: [paid]}
        default: {type: [string, number, boolean, object, array, 'null'], description: The value assumed when none is sent., examples: [open]}
        example: {type: [string, number, boolean, object, array, 'null'], description: An example of the schema's value., examples: [open]}
        nullable: {type: boolean, description: Whether null is allowed., examples: [false]}
        readOnly: {type: boolean, description: Whether it appears only in responses., examples: [false]}
        writeOnly: {type: boolean, description: Whether it appears only in requests., examples: [false]}
        deprecated: {type: boolean, description: Whether the schema is deprecated., examples: [false]}
        properties:
          type: array
          description: 'An object''s properties, in document order.'
          items: {$ref: '#/components/schemas/ReferenceProperty'}
        additionalProperties: {$ref: '#/components/schemas/ReferenceSchema'}
        items: {$ref: '#/components/schemas/ReferenceSchema'}
        allOf:
          type: array
          description: Schemas the value must match all of.
          items: {$ref: '#/components/schemas/ReferenceSchema'}
        oneOf:
          type: array
          description: Schemas the value must match exactly one of.
          items: {$ref: '#/components/schemas/ReferenceSchema'}
        anyOf:
          type: array
          description: Schemas the value must match at least one of.
          items: {$ref: '#/components/schemas/ReferenceSchema'}
        not: {$ref: '#/components/schemas/ReferenceSchema'}
        discriminator: {type: string, description: The property that says which of oneOf or anyOf a value is., examples: [kind]}
    ReferenceProperty:
      type: object
      description: A property of an object schema.
      required: [name, schema]
      properties:
        name: {type: string, description: The property's name., examples: [status]}
        required: {type: boolean, description: Whether it must be present., examples: [true]}
        schema: {$ref: '#/components/schemas/ReferenceSchema'}
    ReferenceNamedSchema:
      type: object
      description: A component schema.
      required: [name, schema]
      properties:
        name: {type: string, description: The component's name., examples: [Order]}
        schema: {$ref: '#/components/schemas/ReferenceSchema'}
    ReferenceSecurityScheme:
      type: object
      description: A way to authorize calls.
      required: [name, type]
      properties:
        name: {type: string, description: The scheme's name in the document., examples: [bearer]}
        type: {type: string, description: 'The scheme type, such as http, apiKey, oauth2 or openIdConnect.', examples: [http]}
        description: {type: string, description: 'The security scheme''s description, in CommonMark.', examples: [A token from the dashboard.]}
        in: {type: string, description: Where an API key goes., examples: [header]}
        parameterName: {type: string, description: 'The header, query parameter or cookie of an API key.', examples: [X-API-Key]}
        scheme: {type: string, description: The HTTP authorization scheme., examples: [bearer]}
        bearerFormat: {type: string, description: The format of a bearer token., examples: [JWT]}
        openIdConnectUrl: {type: string, description: The OpenID Connect discovery URL., examples: ['https://id.example.com/.well-known/openid-configuration']}
        flows:
          type: array
          description: OAuth 2 flows.
          items: {$ref: '#/components/schemas/ReferenceFlow'}
    ReferenceFlow:
      type: object
      description: An OAuth 2 flow.
      required: [type]
      properties:
        type: {type: string, description: The flow., examples: [authorizationCode], enum: [authorizationCode, clientCredentials, implicit, password]}
        authorizationUrl: {type: string, description: Where users authorize., examples: ['https://id.example.com/authorize']}
        tokenUrl: {type: string, description: Where tokens are issued., examples: ['https://id.example.com/token']}
        refreshUrl: {type: string, description: Where tokens are refreshed., examples: ['https://id.example.com/token']}
        scopes:
          type: array
          description: The flow's scopes.
          items: {$ref: '#/components/schemas/ReferenceScope'}
    ReferenceScope:
      type: object
      description: An OAuth 2 scope.
      required: [name]
      properties:
        name: {type: string, description: The scope., examples: ['orders:read']}
        description: {type: string, description: What it allows., examples: [Read orders.]}
    ReferenceSecurityUse:
      type: object
      description: 'A security scheme an operation uses, with the scopes it needs.'
      required: [scheme]
      properties:
        scheme: {type: string, description: The security scheme's name., examples: [bearer]}
        scopes:
          type: array
          description: The scopes needed.
          items: {type: string, description: A scope., examples: ['orders:read']}
