name: Bug report
description: Something doesn't work the way the documentation says it should.
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting. For security problems, follow SECURITY.md instead of opening an issue.
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `signalbox version` or `signalbox-server version`.
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: How do you run Signalbox?
      options:
        - Docker Compose
        - Kubernetes
        - Release binary
        - Built from source
        - The CLI only
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest spec or sequence of steps that shows the problem.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log lines, with secrets removed. Include the request ID if you have one.
      render: text
