name: CI

on:
  push:
    branches: [main]
  pull_request:
    # ready_for_review starts the job that draft pull requests skip.
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A new push makes a pull request's running checks pointless. On main,
  # every commit gets a complete run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space in the background
        # Race-detector test binaries and the PostgreSQL and ClickHouse
        # containers outgrew the runner's free space. These toolchains come
        # with the runner image and Signalbox doesn't use them. Deleting them
        # takes a minute or two, so it runs while the next steps do.
        run: sudo nohup rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL > /dev/null 2>&1 &
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check that go.mod and go.sum are tidy
        run: go mod tidy -diff
      - name: Vet
        run: go vet ./...
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - name: Wait for the disk space
        run: |
          while pgrep -x rm > /dev/null; do sleep 2; done
          df -h /
      - name: Test with the race detector
        # Database tests start PostgreSQL with Testcontainers. In CI they
        # must run, not skip.
        env:
          SIGNALBOX_REQUIRE_DATABASE_TESTS: "1"
        run: go test -race -coverprofile=coverage.out ./...
      - name: Check the spec engine's performance budget
        # Without the race detector, which distorts timings.
        run: go test -count=1 -run TestLargeSpecMeetsBudget -v ./pkg/specengine/
      - name: Lint Signalbox's own API spec
        run: go run ./cmd/signalbox lint --fail-on warning --format github api/openapi.yaml
      - name: Check dependency licenses (ADR-0008)
        # go-licenses doesn't recognize MIT-0, which ADR-0015 allows, so the
        # one module under it is named here.
        run: >-
          go run github.com/google/go-licenses/v2@v2.0.1 check ./... --disallowed_types=forbidden,restricted
          --ignore github.com/segmentio/asm
      - name: Check for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  web:
    name: Web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Check that the API types match api/openapi.yaml
        run: |
          npm run generate:api
          git diff --exit-code -- packages/api-client/src/schema.d.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Check dependency licenses (ADR-0008)
        run: npm run licenses
      - name: Check that the script sandbox bundle matches its sources
        # internal/modules/scripts embeds sandbox.js; this rebuilds it, which
        # also checks the licenses of what it bundles.
        working-directory: internal/modules/scripts/sandbox
        run: |
          npm ci
          npm run build
          git diff --exit-code -- sandbox.js THIRD_PARTY_LICENSES.txt

  image:
    name: Image, Compose stack and end-to-end tests
    # The slowest job, so it runs alongside the others instead of after
    # them. Draft pull requests skip it to save Actions minutes; it runs
    # once they are marked ready for review.
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    env:
      BASE: http://localhost:8080
      SIGNALBOX_SETUP_CODE: CI-E2E-SETUP-CODE-0001
      # Every docker compose command here runs the stack with Dex, the
      # identity provider for the single sign-on tests.
      COMPOSE_FILE: deploy/compose/compose.yaml:deploy/compose/compose.e2e.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Pull requests build the web app and the server outside Docker,
      # where the Go build cache below survives between runs, and put the
      # binary into the image. A cold build inside Docker took about 7
      # minutes. main and releases build the whole Dockerfile from source,
      # so it keeps working.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            e2e/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: github.event_name == 'pull_request'
        with:
          go-version-file: go.mod
          # Its cache is the Go job's, made of race-detector builds this
          # build can't use; the step below keeps a cache of its own.
          cache: false
      - name: Restore the server's Go build cache
        if: github.event_name == 'pull_request'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: image-go-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: image-go-
      - name: Build the web app and the server
        if: github.event_name == 'pull_request'
        run: |
          npm --prefix web ci
          npm --prefix web run build
          pkg=github.com/CemTbi/Signalbox/internal/buildinfo
          flags="-s -w -X $pkg.version=0.0.0-ci -X $pkg.commit=${{ github.sha }}"
          CGO_ENABLED=0 go build -trimpath -ldflags "$flags" -o ci-build/signalbox-server ./cmd/signalbox-server
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          tags: signalbox-server:dev
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=0.0.0-ci
            COMMIT=${{ github.sha }}
            BINARY=${{ github.event_name == 'pull_request' && 'prebuilt' || 'built' }}
      - name: Start the Compose stack
        run: docker compose up -d --no-build --wait --wait-timeout 180
      - name: Check the running server
        run: |
          curl -fsS "$BASE/readyz"
          curl -fsS "$BASE/api/v1/meta"
          curl -fsS "$BASE/" | grep -q '<div id="root">'
          curl -fsS "$BASE/api/v1/setup" | grep -q '"required":true'
          curl -fsS "$BASE/api/v1/sign-in-options" | grep -q '"name":"Dex"'

      - name: Install the end-to-end tests and Chromium
        working-directory: e2e
        run: |
          npm ci
          npm run typecheck
          npx playwright install --with-deps chromium
      - name: Run the end-to-end tests
        working-directory: e2e
        env:
          SIGNALBOX_E2E_BASE_URL: ${{ env.BASE }}
          SIGNALBOX_E2E_SETUP_CODE: ${{ env.SIGNALBOX_SETUP_CODE }}
        run: npm test

      - name: Check Signalbox's own API spec as the admin the tests created
        run: |
          session=$(curl -fsS -c cookies.txt -H "Origin: $BASE" -H 'Content-Type: application/json' \
            -d '{"email":"ada@example.com","password":"correct horse battery staple"}' "$BASE/api/v1/sessions")
          csrf=$(jq -r .csrfToken <<<"$session")
          curl -fsS -b cookies.txt -H "Origin: $BASE" -H "X-CSRF-Token: $csrf" -H 'Content-Type: application/yaml' \
            --data-binary @api/openapi.yaml "$BASE/api/v1/spec-checks?ruleSets=recommended" | grep -q '"errors":0'

      - name: Keep the end-to-end report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop the Compose stack
        if: always()
        run: docker compose down -v
