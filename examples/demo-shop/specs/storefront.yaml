openapi: 3.1.1
info:
  title: Storefront API
  version: 1.0.0
  description: The demo shop's web API, which browsers call. It passes requests on to the inventory and orders services.
  license: {name: Apache-2.0, identifier: Apache-2.0}
servers:
  - url: http://localhost:8090
    description: The demo shop on this machine, as Compose publishes it.
tags:
  - name: Shop
    description: Browsing and buying.
  - name: Health
    description: Whether the service works.
paths:
  /api/products:
    get:
      operationId: listProducts
      summary: List products
      description: Lists what the shop sells.
      tags: [Shop]
      responses:
        '200':
          description: The products.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    description: The products, by SKU.
                    items: {$ref: '#/components/schemas/Product'}
                    examples: [[{sku: TEA-01, name: 'Sencha, 100 g', priceCents: 1290, stock: 40}]]
              example:
                data:
                  - {sku: TEA-01, name: 'Sencha, 100 g', priceCents: 1290, stock: 40}
  /api/checkout:
    post:
      operationId: checkout
      summary: Check out
      description: Places an order for the items.
      tags: [Shop]
      requestBody:
        required: true
        description: The items to buy.
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  description: What to buy.
                  items: {$ref: '#/components/schemas/OrderItem'}
                  examples: [[{sku: TEA-01, quantity: 2}]]
            example: {items: [{sku: TEA-01, quantity: 2}]}
      responses:
        '201':
          description: The order is placed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
              example: {id: ord_7k2m9x4q1w8e5r3t, items: [{sku: TEA-01, quantity: 2}], amountCents: 2580, paymentId: ch_4f8a2k9m1x7q3w5e, createdAt: '2026-10-31T12:00:00Z'}
        '409':
          description: An item is out of stock.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              example: {title: Conflict, status: 409, detail: TEA-01 is out of stock.}
        '502':
          description: The shop's backend failed.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              example: {title: Bad Gateway, status: 502, detail: The shop's backend failed.}
  /api/orders/{id}:
    get:
      operationId: getOrder
      summary: Read an order
      description: Returns an order by its ID.
      tags: [Shop]
      parameters:
        - name: id
          in: path
          required: true
          description: The order's ID.
          schema: {type: string, examples: [ord_7k2m9x4q1w8e5r3t]}
      responses:
        '200':
          description: The order.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
              example: {id: ord_7k2m9x4q1w8e5r3t, items: [{sku: TEA-01, quantity: 2}], amountCents: 2580, paymentId: ch_4f8a2k9m1x7q3w5e, createdAt: '2026-10-31T12:00:00Z'}
        '404':
          description: There is no such order.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              example: {title: Not Found, status: 404, detail: There is no order ord_7k2m9x4q1w8e5r3t.}
  /health:
    get:
      operationId: getHealth
      summary: Check health
      description: Reports whether the shop works, in the Health Check Response Format.
      tags: [Health]
      responses:
        '200':
          description: The shop works, maybe with a warning.
          content:
            application/health+json:
              schema: {$ref: '#/components/schemas/Health'}
              example: {status: pass, serviceId: storefront-web, version: 1.0.0}
components:
  schemas:
    Product:
      type: object
      description: A product the shop sells.
      required: [sku, name, priceCents, stock]
      properties:
        sku: {type: string, description: The product's stock keeping unit., examples: [TEA-01]}
        name: {type: string, description: The product's name., examples: ['Sencha, 100 g']}
        priceCents: {type: integer, minimum: 1, description: The price in euro cents., examples: [1290]}
        stock: {type: integer, minimum: 0, description: How many are in stock., examples: [40]}
    OrderItem:
      type: object
      description: A product and how many.
      required: [sku, quantity]
      properties:
        sku: {type: string, description: The product., examples: [TEA-01]}
        quantity: {type: integer, minimum: 1, description: How many., examples: [2]}
    Order:
      type: object
      description: A placed order.
      required: [id, items, amountCents, paymentId, createdAt]
      properties:
        id: {type: string, description: The order's ID., examples: [ord_7k2m9x4q1w8e5r3t]}
        items:
          type: array
          description: What was bought.
          items: {$ref: '#/components/schemas/OrderItem'}
          examples: [[{sku: TEA-01, quantity: 2}]]
        amountCents: {type: integer, minimum: 1, description: The total in euro cents., examples: [2580]}
        paymentId: {type: string, description: The charge that paid it., examples: [ch_4f8a2k9m1x7q3w5e]}
        createdAt: {type: string, format: date-time, description: When it was placed., examples: ['2026-10-31T12:00:00Z']}
    Health:
      type: object
      description: A health response, in the Health Check Response Format.
      required: [status]
      properties:
        status: {type: string, enum: [pass, warn, fail], description: Whether the service works., examples: [pass]}
        serviceId: {type: string, description: The service., examples: [storefront-web]}
        version: {type: string, description: The service's version., examples: [1.0.0]}
    Problem:
      type: object
      description: An RFC 9457 problem.
      required: [title, status]
      properties:
        title: {type: string, description: The status's name., examples: [Conflict]}
        status: {type: integer, description: The HTTP status., examples: [409]}
        detail: {type: string, description: What went wrong., examples: [TEA-01 is out of stock.]}
