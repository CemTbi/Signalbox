version: 2

project_name: signalbox

before:
  hooks:
    - go mod tidy -diff
    - npm --prefix web ci
    - npm --prefix web run build

builds:
  - id: signalbox
    main: ./cmd/signalbox
    binary: signalbox
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/CemTbi/Signalbox/internal/buildinfo.version={{ .Version }}
      - -X github.com/CemTbi/Signalbox/internal/buildinfo.commit={{ .ShortCommit }}
      - -X github.com/CemTbi/Signalbox/internal/buildinfo.date={{ .Date }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
  - id: signalbox-server
    main: ./cmd/signalbox-server
    binary: signalbox-server
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/CemTbi/Signalbox/internal/buildinfo.version={{ .Version }}
      - -X github.com/CemTbi/Signalbox/internal/buildinfo.commit={{ .ShortCommit }}
      - -X github.com/CemTbi/Signalbox/internal/buildinfo.date={{ .Date }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: signalbox
    ids: [signalbox]
    name_template: "signalbox_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md, CHANGELOG.md]
  - id: signalbox-server
    ids: [signalbox-server]
    name_template: "signalbox-server_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md, CHANGELOG.md]

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - --output-certificate=${certificate}
      - --output-signature=${signature}
      - ${artifact}
      - --yes

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  use: github
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]-]+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\([[:word:]-]+\))??!?:.+$'
      order: 1
    - title: Other changes
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  draft: true
  prerelease: auto
