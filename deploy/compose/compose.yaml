# Signalbox on a single machine: the server with every role, PostgreSQL and
# ClickHouse.
#
#   docker compose -f deploy/compose/compose.yaml up -d --build
#
# Then open http://localhost:8080. Set POSTGRES_PASSWORD and
# CLICKHOUSE_PASSWORD in a .env file next to this one for anything beyond a
# local trial.
#
# Pre-alpha: the server doesn't read the database settings yet. They are here
# so the stack and its volumes stay the same when storage lands.

name: signalbox

services:
  signalbox:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: signalbox-server:dev
    command: ["serve"]
    environment:
      SIGNALBOX_ROLES: all
      SIGNALBOX_HTTP_ADDR: ":8080"
      SIGNALBOX_OPS_ADDR: ":9090"
      SIGNALBOX_LOG_FORMAT: json
      SIGNALBOX_DRAIN_DELAY: 2s
      SIGNALBOX_DATABASE_URL: postgres://signalbox:${POSTGRES_PASSWORD:-signalbox}@postgres:5432/signalbox?sslmode=disable
      SIGNALBOX_CLICKHOUSE_URL: clickhouse://signalbox:${CLICKHOUSE_PASSWORD:-signalbox}@clickhouse:9000/signalbox
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: signalbox
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-signalbox}
      POSTGRES_DB: signalbox
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signalbox -d signalbox"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:26.8
    environment:
      CLICKHOUSE_DB: signalbox
      CLICKHOUSE_USER: signalbox
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-signalbox}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/small-machine.xml:/etc/clickhouse-server/config.d/small-machine.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8123/ping | grep -q Ok"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  postgres-data:
  clickhouse-data:
