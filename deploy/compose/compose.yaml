# Signalbox on a single machine: the server with every role, PostgreSQL and
# ClickHouse.
#
#   docker compose -f deploy/compose/compose.yaml up -d --build
#
# Then open http://localhost:8080 and create the first admin account with the
# setup code from the server log:
#
#   docker compose -f deploy/compose/compose.yaml logs signalbox | grep setup_code
#
# For anything beyond a local trial, put a .env file next to this one with at
# least POSTGRES_PASSWORD, CLICKHOUSE_PASSWORD and SIGNALBOX_PUBLIC_URL, the
# address people will open, such as https://signalbox.example.com.

name: signalbox

services:
  signalbox:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: signalbox-server:dev
    command: ["serve"]
    environment:
      SIGNALBOX_ROLES: all
      SIGNALBOX_HTTP_ADDR: ":8080"
      SIGNALBOX_OPS_ADDR: ":9090"
      SIGNALBOX_PUBLIC_URL: ${SIGNALBOX_PUBLIC_URL:-http://localhost:8080}
      # Empty means the server logs a random setup code at startup.
      SIGNALBOX_SETUP_CODE: ${SIGNALBOX_SETUP_CODE:-}
      SIGNALBOX_TRUSTED_PROXIES: ${SIGNALBOX_TRUSTED_PROXIES:-}
      # Encrypts secrets, such as secret environment variables: 32 random
      # bytes in base64, from `openssl rand -base64 32`. Empty means
      # environments can't keep secrets. Back it up: losing or changing it
      # makes stored secrets unreadable.
      SIGNALBOX_SECRET_KEY: ${SIGNALBOX_SECRET_KEY:-}
      # Single sign-on through an OpenID Connect provider, off while the
      # issuer is empty. Register <public URL>/api/v1/sso/callback as the
      # redirect URL at the provider. `signalbox-server serve --help` lists
      # the other single sign-on settings.
      SIGNALBOX_OIDC_ISSUER: ${SIGNALBOX_OIDC_ISSUER:-}
      SIGNALBOX_OIDC_CLIENT_ID: ${SIGNALBOX_OIDC_CLIENT_ID:-}
      SIGNALBOX_OIDC_CLIENT_SECRET: ${SIGNALBOX_OIDC_CLIENT_SECRET:-}
      SIGNALBOX_OIDC_NAME: ${SIGNALBOX_OIDC_NAME:-}
      SIGNALBOX_OIDC_ALLOWED_DOMAINS: ${SIGNALBOX_OIDC_ALLOWED_DOMAINS:-}
      SIGNALBOX_LOG_FORMAT: json
      SIGNALBOX_DRAIN_DELAY: 2s
      SIGNALBOX_DATABASE_URL: postgres://signalbox:${POSTGRES_PASSWORD:-signalbox}@postgres:5432/signalbox?sslmode=disable
      # Spans and what's built from them. SIGNALBOX_TRACE_RETENTION_DAYS sets
      # how long spans are kept, 7 days by default.
      SIGNALBOX_CLICKHOUSE_URL: clickhouse://signalbox:${CLICKHOUSE_PASSWORD:-signalbox}@clickhouse:9000/signalbox
    ports:
      - "8080:8080"
      # The ingest role: spans over OTLP/gRPC, OTLP/HTTP and Zipkin v2, with
      # an ingest key from a project's Ingest keys page.
      - "4317:4317"
      - "4318:4318"
      - "9411:9411"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: signalbox
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-signalbox}
      POSTGRES_DB: signalbox
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signalbox -d signalbox"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:26.8
    environment:
      CLICKHOUSE_DB: signalbox
      CLICKHOUSE_USER: signalbox
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-signalbox}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/small-machine.xml:/etc/clickhouse-server/config.d/small-machine.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8123/ping | grep -q Ok"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  postgres-data:
  clickhouse-data:
