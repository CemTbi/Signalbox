# End-to-end test additions to compose.yaml: a Dex identity provider,
# single sign-on through it, and a secret key.
#
#   docker compose -f deploy/compose/compose.yaml -f deploy/compose/compose.e2e.yaml up -d --wait

services:
  dex:
    image: ghcr.io/dexidp/dex:v2.46.0
    command: ["dex", "serve", "/etc/dex/e2e.yaml"]
    volumes:
      - ./dex/e2e.yaml:/etc/dex/e2e.yaml:ro
    ports:
      - "127.0.0.1:5556:5556"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5556/dex/.well-known/openid-configuration"]
      interval: 2s
      timeout: 3s
      retries: 30

  signalbox:
    environment:
      SIGNALBOX_OIDC_ISSUER: http://dex:5556/dex
      SIGNALBOX_OIDC_CLIENT_ID: signalbox
      SIGNALBOX_OIDC_CLIENT_SECRET: e2e-client-secret
      SIGNALBOX_OIDC_NAME: Dex
      # A fixed key for tests only; never use it for real secrets.
      SIGNALBOX_SECRET_KEY: c2lnbmFsYm94LWUyZS10ZXN0LWtleS1ub3QtcmVhbCE=
    depends_on:
      dex:
        condition: service_healthy
