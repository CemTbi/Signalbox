# Development additions to compose.yaml: PostgreSQL and ClickHouse on
# localhost, so a server started with `make run` or `go run` can use them.
#
#   docker compose -f deploy/compose/compose.yaml -f deploy/compose/compose.dev.yaml up -d postgres clickhouse
#
# The ports are bound to 127.0.0.1 only, so the databases aren't reachable
# from other machines.

services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"
  clickhouse:
    ports:
      - "127.0.0.1:9000:9000"
