# Development additions to compose.yaml: PostgreSQL on localhost, so a
# server started with `make run` or `go run` can use it.
#
#   docker compose -f deploy/compose/compose.yaml -f deploy/compose/compose.dev.yaml up -d postgres
#
# The port is bound to 127.0.0.1 only, so the database isn't reachable from
# other machines.

services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"
